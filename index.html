  <script>
  (function() {
    var _origOpen   = window.open;
    var _origAssign = window.location ? window.location.assign.bind(window.location) : null;
    var _origReplace = window.location ? window.location.replace.bind(window.location) : null;

    window.open = function(url, target, features) {
      if (url && typeof url === 'string' && url.indexOf('http') === 0) {
        var tgApp = window.Telegram && window.Telegram.WebApp;
        if (tgApp && typeof tgApp.openLink === 'function') {
          try { tgApp.openLink(url, { try_instant_view: false }); return null; } catch(e) {}
        }
        return _origOpen.call(window, url, '_blank', features);
      }
      return _origOpen.apply(window, arguments);
    };

    try {
      var _hrefDescriptor = Object.getOwnPropertyDescriptor(window.location, 'href');
      if (_hrefDescriptor && _hrefDescriptor.set) {
        var _origHrefSet = _hrefDescriptor.set;
        Object.defineProperty(window.location, 'href', {
          get: _hrefDescriptor.get,
          set: function(url) {
            if (url && typeof url === 'string' && url.indexOf('http') === 0) {
              var tgApp = window.Telegram && window.Telegram.WebApp;
              if (tgApp && typeof tgApp.openLink === 'function') {
                try { tgApp.openLink(url, { try_instant_view: false }); return; } catch(e) {}
              }
            }
            _origHrefSet.call(window.location, url);
          },
          configurable: true
        });
      }
    } catch(e) {}

    if (_origAssign) {
      window.location.assign = function(url) {
        if (url && typeof url === 'string' && url.indexOf('http') === 0) {
          var tgApp = window.Telegram && window.Telegram.WebApp;
          if (tgApp && typeof tgApp.openLink === 'function') {
            try { tgApp.openLink(url, { try_instant_view: false }); return; } catch(e) {}
          }
        }
        _origAssign(url);
      };
    }

    if (_origReplace) {
      window.location.replace = function(url) {
        if (url && typeof url === 'string' && url.indexOf('http') === 0) {
          var tgApp = window.Telegram && window.Telegram.WebApp;
          if (tgApp && typeof tgApp.openLink === 'function') {
            try { tgApp.openLink(url, { try_instant_view: false }); return; } catch(e) {}
          }
        }
        _origReplace(url);
      };
    }
  })();
  </script>

  <style>
    :root {
      --of-navy:        #00aff0;
      --of-navy-dk:     #008ecf;
      --of-navy-deep:   #005f8e;
      --of-pale:        #e0f5fd;
      --of-white:       #ffffff;
      --of-accent:      #00aff0;
      --of-accent-dk:   #008ecf;
      --of-teal:        #00c6ff;
      --bg:             #f4fbff;
      --card:           #ffffff;
      --text:           #0a2233;
      --text-muted:     #4a6a80;
      --border:         #bde8f8;
      --step-done-bg:   #e0f5fd;
      --step-done-text: #005f8e;
      --radius-card:    20px;
      --radius-btn:     10px;
      --shadow-card:    0 4px 24px rgba(0,175,240,.13);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Mulish', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 44px rgba(0,175,240,.18);
    }
    @media (max-width: 480px) {
      body { padding: 0; justify-content: flex-start; }
      .app-shell { border-radius: 0; box-shadow: none; max-width: 100%; }
    }

    .top-bar {
      width: 100%;
      background: linear-gradient(135deg, var(--of-navy-deep), var(--of-navy));
      padding: 14px 20px 12px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 4px solid var(--of-teal);
    }
    .logo-u {
      width: 32px; height: 32px; border-radius: 6px;
      background: var(--of-white);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: var(--of-navy-deep);
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 14px; font-weight: 800; color: #fff;

      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge-free {
      margin-left: auto;
      background: var(--of-teal); color: #003d55;
      font-size: 11px; font-weight: 800;
      padding: 4px 10px; border-radius: 20px;
    }

    .skeleton {
      width: 100%;
      margin: 0;
      background: var(--card);
      border-radius: 0;
      box-shadow: none;
      padding: 22px 20px;
    }
    .skel-line {
      background: linear-gradient(90deg, #d0eefa 25%, #eaf7ff 50%, #d0eefa 75%);
      background-size: 200% 100%;
      border-radius: 6px; margin-bottom: 10px;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skel-thumb { width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0; }
    .skel-row { display: flex; gap: 12px; margin-bottom: 18px; }
    .skel-lines { flex: 1; }

    .card {
      width: 100%;
      margin: 0;
      background: var(--card);
      border-radius: 0;
      box-shadow: none;
      padding: 20px 18px 18px;
      animation: slideUp .45s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .course-info {
      display: flex; gap: 12px;
      margin-bottom: 14px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .course-thumb {
      width: 64px; height: 64px; border-radius: 10px;
      background: linear-gradient(135deg, var(--of-navy-deep), var(--of-navy));
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;

    .course-meta { flex:1; min-width:0; }
    .course-title {

    .course-tags { display:flex; gap:6px; flex-wrap:wrap; }

      padding: 3px 8px; border-radius: 5px;
      background: var(--of-pale); color: var(--of-navy-deep);

    .unlock-headline p  { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }

    .ad-notice {
      background: var(--of-pale);
      border: 1.5px solid var(--of-navy);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 11.5px;
      color: var(--of-navy-deep);
      font-weight: 700;
      text-align: center;
      line-height: 1.45;
    }

    .progress-wrap { margin: 12px 0; display: flex; align-items: center; gap: 10px; }
    .progress-bar-bg { flex:1; height:7px; background:var(--border); border-radius:10px; overflow:hidden; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--of-navy-deep), var(--of-teal));
      border-radius: 10px; width: 0%;
      transition: width .5s ease;
    }
    .progress-label { font-size:12px; font-weight:800; color:var(--of-navy-deep); min-width:30px; text-align:right; }

    .steps { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .step {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 10px 12px;
      transition: border-color .3s, background .3s;
    }
    .step.locked { opacity:.5; pointer-events:none; }
    .step.done   { border-color: var(--of-navy); background: var(--step-done-bg); }

    .step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--of-pale); color: var(--of-navy-deep);

      transition: background .3s, color .3s;
      position: relative;
    }
    .step.done .step-num { background: var(--of-navy); color:#fff; font-size:16px; }

    .countdown-ring {
      position: absolute; top: 0; left: 0;
      width: 32px; height: 32px;
      transform: rotate(-90deg);

      opacity: 0; transition: opacity .2s;

    .countdown-ring.active { opacity: 1; }
    .countdown-ring circle {
      fill: none; stroke: var(--of-teal);
      stroke-width: 3;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      stroke-linecap: round;
      transition: stroke-dashoffset .95s linear;

    .step-body { flex:1; min-width:0; }
    .step-title { font-size:14px; font-weight:800; color:var(--text); }
    .step.done .step-title { color: var(--of-navy-deep); }

    .step-btn {
      background: linear-gradient(135deg, var(--of-navy), var(--of-navy-dk));

      border-radius: var(--radius-btn); padding: 7px 14px;

      cursor: pointer; flex-shrink: 0;

      min-width: 60px; text-align: center;
    }
    .step-btn:active  { transform: scale(.96); }
    .step-btn:disabled { background: #a8cfe0; cursor: not-allowed; }
    .step-btn.watching { background: #0099cc; pointer-events: none; }
    .step-btn.done-mark {
      background: transparent; color: var(--of-navy-deep);
      font-size: 20px; pointer-events: none; padding: 0 12px;
    }

    .cta-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;

      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .3s;

    .cta-btn.locked  { background:var(--border); color:var(--text-muted); cursor:not-allowed; }
    .cta-btn.unlocked {
      background: linear-gradient(135deg, var(--of-navy), var(--of-teal));
      color: #fff;
      box-shadow: 0 6px 18px -4px rgba(0,175,240,.55);
      animation: pulseBlue 2.2s infinite;
    }
    @keyframes pulseBlue {
      0%  { box-shadow: 0 0 0 0   rgba(0,175,240,.45); }
      60% { box-shadow: 0 0 0 12px rgba(0,175,240,0);  }
      100%{ box-shadow: 0 0 0 0   rgba(0,175,240,0);   }
    }

    .tads-banner-section {
      width: 100%;
      padding: 0 18px 14px;
      background: var(--bg);
    }
    #tads-container-9636 {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .encyclo-section {
      width: 100%;
      margin: 0;
      padding: 14px 18px 18px;
      background: var(--bg);
    }
    .encyclo-banner {
      background: linear-gradient(135deg, var(--of-navy-deep), var(--of-navy));
      border-radius: 16px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0,175,240,.25);
      transition: transform .2s, box-shadow .2s;
    }
    .encyclo-banner:active { transform: scale(.98); }
    .encyclo-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--of-white);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }
    .encyclo-text { flex: 1; }
    .encyclo-title {
      font-size: 13px; font-weight: 900; color: #fff;
      margin-bottom: 3px;
    }
    .encyclo-sub {
      font-size: 11px; color: rgba(255,255,255,.85);

    .encyclo-arrow {
      background: var(--of-teal);

      border-radius: 8px;

    #confetti-canvas {
      position: fixed; top:0; left:0;

    .success-msg {
      display: none;

    @media (max-width:380px) {

    @media (max-height:720px) {
      body { padding: 10px 12px; }
      .unlock-headline h2 { font-size:16px; }
      .unlock-headline p  { font-size:11.5px; margin-top:3px; }
      .steps { gap:6px; margin-bottom:12px; }
      .step  { padding:8px 12px; }
    }
  </style>

<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // ── Constants ─────────────────────────────────────────────
  const AD_DURATION_SEC = 5;
  const TADS_FULLSCREEN_IDS = { 1: 9579, 2: 9966 };
  const TADS_TGB_ID = 9636;

  // ── Helpers ───────────────────────────────────────────────
  function b64urlDecode(str) {
    const b64    = str.replace(/-/g, '+').replace(/_/g, '/');
    const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const binary = atob(padded);
    const bytes  = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function getStartParam() {
    const tg = window.Telegram?.WebApp;
    return tg?.initDataUnsafe?.start_param
        || new URLSearchParams(window.location.search).get('startapp')
        || new URLSearchParams(window.location.search).get('tgWebAppStartParam')
        || null;
  }

  function resolveCourseUrl() {
    const raw = getStartParam();
    if (!raw) return 'https://www.udemy.com/';
    try {
      const text   = b64urlDecode(raw);
      const parsed = JSON.parse(text);
      if (parsed && typeof parsed === 'object' && parsed.u) {
        window.__courseData = parsed;
        return parsed.u;
      }
    } catch (e) {}
    try {
      const decoded = b64urlDecode(raw);
      if (decoded.startsWith('http')) return decoded;
    } catch (e) {}
    return 'https://www.udemy.com/';
  }

  const COURSE_URL = resolveCourseUrl();
  const CACHE_KEY = 'ud_progress_' + COURSE_URL.slice(-20);
  const CACHE_TTL = 5 * 60 * 1000;

  function loadProgress() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL) { localStorage.removeItem(CACHE_KEY); return null; }
      return obj;
    } catch(e) { return null; }
  }

  function saveProgress(step1, step2) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ step1, step2, ts: Date.now() })); } catch(e) {}
  }

  // ── Ad SDK Helpers ────────────────────────────────────────
  function waitForTads(timeout = 6000) {
    return new Promise((resolve, reject) => {
      if (window.tads && typeof window.tads.init === 'function') return resolve();
      const start = performance.now();
      const iv = setInterval(() => {
        if (window.tads && typeof window.tads.init === 'function') {
          clearInterval(iv); resolve();
        } else if (performance.now() - start > timeout) {
          clearInterval(iv); reject(new Error('tads timeout'));
        }
      }, 50);
    });
  }

  function showTadsFullscreen(stepN) {
    return new Promise(async (resolve) => {
      try {
        await waitForTads(5000);
        const widgetId = TADS_FULLSCREEN_IDS[stepN];
        let settled = false;

        const ctrl = window.tads.init({
          widgetId: widgetId,
          type: 'fullscreen',
          debug: false,
          onShowReward: () => { if (!settled) { settled = true; resolve(true); } },
          onAdsNotFound: () => { if (!settled) { settled = true; resolve(false); } }
        });

        if (ctrl && typeof ctrl.showAd === 'function') {
          ctrl.showAd().catch(() => { if (!settled) { settled = true; resolve(false); } });
        } else {
          if (!settled) { settled = true; resolve(false); }
        }
        setTimeout(() => { if (!settled) { settled = true; resolve(false); } }, 7000);
      } catch (e) { resolve(false); }
    });
  }

  function waitForRichInfo(timeout = 7000) {
    return new Promise((resolve, reject) => {
      if (window._richInfoReady) return resolve();
      const start = performance.now();
      const iv = setInterval(() => {
        if (window._richInfoReady) { clearInterval(iv); resolve(); }
        else if (performance.now() - start > timeout) { clearInterval(iv); reject(new Error('richinfo timeout')); }
      }, 100);
    });
  }

  function showRichInfoAd() {
    return new Promise(async (resolve) => {
      try {
        await waitForRichInfo(6000);
        const ctrl = window.TelegramAdsController;
        if (!ctrl || typeof ctrl.showAd !== 'function') return resolve(false);
        let settled = false;
        ctrl.showAd({
          onSuccess: () => { if (!settled) { settled = true; resolve(true); } },
          onError:   () => { if (!settled) { settled = true; resolve(false); } },
          onClose:   () => { if (!settled) { settled = true; resolve(true); } },
        });
        setTimeout(() => { if (!settled) { settled = true; resolve(false); } }, 10000);
      } catch (e) { resolve(false); }
    });
  }

  function initTadsBanner() {
    waitForTads().then(() => {
      const ctrl = window.tads.init({
        widgetId: TADS_TGB_ID,
        type: 'static',
        debug: false,
        onAdsNotFound: () => {}
      });
      ctrl.loadAd().then(() => ctrl.showAd()).catch(() => {});
    }).catch(() => {});
  }

  // ── Confetti ──────────────────────────────────────────────
  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.style.display = 'block';
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#00aff0','#ffffff','#00c6ff','#005f8e','#008ecf','#e0f5fd'];
    const pieces = Array.from({length: 90}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 5 + 3,
      d: Math.random() * 2 + 1,
      color: colors[Math.floor(Math.random()*colors.length)],
      tilt: Math.random()*10-5,
      tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
    }));

    let frame = 0;
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p => {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2);
        ctx.fill();
        p.y += p.d + frame/80;
        p.tilt += p.tiltSpeed;
        p.x += Math.sin(frame/20) * 0.5;
        if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
      });
      frame++;
      if (frame < 160) requestAnimationFrame(draw);
      else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
    }
    draw();
  }

  // ── Components ────────────────────────────────────────────

  function TopBar({ title }) {
    return (
      <div className="top-bar">
        <div className="logo-u">u</div>
        <span className="logo-text">{title || 'UdemySY Free Courses'}</span>
        <span className="badge-free">FREE</span>
      </div>
    );
  }

  function Skeleton() {
    return (
      <div className="skeleton">
        <div className="skel-row">
          <div className="skel-line skel-thumb"></div>
          <div className="skel-lines">
            <div className="skel-line" style={{height:14,width:'80%'}}></div>
            <div className="skel-line" style={{height:11,width:'55%',marginTop:6}}></div>
            <div className="skel-line" style={{height:11,width:'40%',marginTop:6}}></div>
          </div>
        </div>
        <div className="skel-line" style={{height:16,width:'60%',margin:'0 auto 10px'}}></div>
        <div className="skel-line" style={{height:10,width:'90%',margin:'0 auto 18px'}}></div>
        <div className="skel-line" style={{height:56,borderRadius:14}}></div>
        <div className="skel-line" style={{height:56,borderRadius:14}}></div>
        <div className="skel-line" style={{height:52,borderRadius:14,marginTop:4}}></div>
      </div>
    );
  }

  function StepItem({ n, state, onStart, step1Done }) {
    const isLocked = n === 2 && !step1Done;
    const isDone   = state[n].done;
    const isPlaying= state[n].playing;

    const circumference = 2 * Math.PI * 13;
    const [ringOffset, setRingOffset] = useState(circumference);
    const [ringActive, setRingActive] = useState(false);
    const [btnText, setBtnText]       = useState('Visit');
    const [subText, setSubText]       = useState(`~${AD_DURATION_SEC} seconds • watch the ad to unlock`);

    const timerRef = useRef(null);

    useEffect(() => {
      if (isPlaying) {
        setRingActive(true);
        setBtnText(String(AD_DURATION_SEC));
        setSubText(`${AD_DURATION_SEC}s • watching ad…`);
        let remaining = AD_DURATION_SEC;
        timerRef.current = setInterval(() => {
          remaining--;
          const progress = (AD_DURATION_SEC - remaining) / AD_DURATION_SEC;
          setRingOffset(circumference * (1 - progress));
          if (remaining > 0) {
            setBtnText(String(remaining));
            setSubText(`${remaining}s • watching ad…`);
          } else {
            clearInterval(timerRef.current);
            setRingActive(false);
          }
        }, 1000);
      } else {
        clearInterval(timerRef.current);
        setRingActive(false);
        setRingOffset(circumference);
      }
      return () => clearInterval(timerRef.current);
    }, [isPlaying, circumference]);

    useEffect(() => {
      if (isDone) {
        setBtnText('✓');
        setSubText('Completed ✓');
      }
    }, [isDone]);

    return (
      <div className={`step ${isLocked ? 'locked' : ''} ${isDone ? 'done' : ''}`} id={`step-${n}`}>
        <div className="step-num" id={`num-${n}`}>
          {isDone ? '✓' : n}
          <svg className={`countdown-ring ${ringActive ? 'active' : ''}`} id={`ring-${n}`} viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="13"
              style={{
                fill:'none', stroke:'var(--of-teal)', strokeWidth:3,
                strokeDasharray: circumference,
                strokeDashoffset: ringOffset,
                strokeLinecap:'round',
                transition: 'stroke-dashoffset .95s linear'
              }}
            />
          </svg>
        </div>
        <div className="step-body">
          <div className="step-title">Visit Sponsor Page #{n}</div>
          <div className="step-sub" id={`sub-${n}`}>{subText}</div>
        </div>
        <button
          className={`step-btn ${isPlaying ? 'watching' : ''} ${isDone ? 'done-mark' : ''}`}
          id={`btn-${n}`}
          disabled={isLocked || isDone || isPlaying}
          onClick={() => onStart(n)}
        >
          {isDone ? '✓' : (isPlaying ? '⏳' : btnText)}
        </button>
      </div>
    );
  }

  function App() {
    const [loading, setLoading] = useState(true);
    const [courseData, setCourseData] = useState(null);
    const [stepState, setStepState] = useState({
      1: { done: false, playing: false },
      2: { done: false, playing: false },
    });
    const [successVisible, setSuccessVisible] = useState(false);

    const tgRef = useRef(window.Telegram?.WebApp || null);

    // Init Telegram
    useEffect(() => {
      const tg = tgRef.current;
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
      }
    }, []);

    // Load course meta & progress
    useEffect(() => {
      let cd = window.__courseData || null;
      if (!cd) {
        const p = new URLSearchParams(window.location.search);
        const get = k => p.get(k) ? decodeURIComponent(p.get(k)) : null;
        cd = { t: get('title'), i: get('img'), c: get('cat'), p: get('price'), l: get('left') };
      }
      setCourseData(cd);

      const cached = loadProgress();
      if (cached?.step1 && cached?.step2) {
        setStepState({ 1: { done: true, playing: false }, 2: { done: true, playing: false } });
        setSuccessVisible(true);
      }

      const t = setTimeout(() => setLoading(false), 400);
      return () => clearTimeout(t);
    }, []);

    // Init tads banner
    useEffect(() => {
      initTadsBanner();
    }, []);

    const doneCount = (stepState[1].done?1:0) + (stepState[2].done?1:0);
    const progressWidth = `${doneCount * 50}%`;

    const startStep = useCallback((n) => {
      setStepState(prev => {
        if (prev[n].playing) return prev;
        if (n === 1 && prev[1].done) return prev;
        if (n === 2 && (!prev[1].done || prev[2].done)) return prev;
        return { ...prev, [n]: { ...prev[n], playing: true } };
      });

      let timerDone = false;
      let adHandled = false;
      let timerStarted = false;

      function startTimer() {
        if (timerStarted) return;
        timerStarted = true;
        let remaining = AD_DURATION_SEC;
        const iv = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(iv);
            timerDone = true;
            tryComplete();
          }
        }, 1000);
      }

      function tryComplete() {
        if (timerDone && adHandled) onAdComplete(n);
      }

      function onVisibilityReturn() {
        if (document.visibilityState === 'visible') {
          document.removeEventListener('visibilitychange', onVisibilityReturn);
          if (!adHandled) { adHandled = true; tryComplete(); }
          if (!timerStarted) startTimer();
        }
      }
      document.addEventListener('visibilitychange', onVisibilityReturn);

      showTadsFullscreen(n).then((tadsShown) => {
        if (tadsShown) {
          startTimer();
          adHandled = true;
          tryComplete();
        } else {
          startTimer();
          if (n === 1) {
            adHandled = true;
            tryComplete();
          } else {
            showRichInfoAd().then(() => {
              adHandled = true;
              tryComplete();
            });
          }
        }
      });
    }, []);

    function onAdComplete(n) {
      setStepState(prev => {
        const next = { ...prev, [n]: { done: true, playing: false } };
        if (n === 1) saveProgress(true, false);
        else { saveProgress(true, true); setSuccessVisible(true); launchConfetti(); }
        return next;
      });
    }

    function enrollNow() {
      if (!stepState[1].done || !stepState[2].done) return;
      const tg = tgRef.current;
      if (tg && typeof tg.openLink === 'function') {
        tg.openLink(COURSE_URL, { try_instant_view: false });
      } else {
        const a = document.createElement('a');
        a.href = COURSE_URL;
        a.target = '_blank';
        a.rel = 'noopener';
        a.click();
      }
    }

    const title = courseData?.t || 'Udemy Free Course';
    const img   = courseData?.i;
    const cat   = courseData?.c || 'Udemy';
    const price = courseData?.p;
    const left  = courseData?.l;

    return (
      <div className="app-shell">
        <TopBar title={title} />

        {loading ? (
          <Skeleton />
        ) : (
          <div className="card" id="main-card">
            <div className="course-info">
              <div className="course-thumb" id="course-thumb">
                {img ? <img src={img} alt="course" onError={(e) => e.target.parentElement.innerHTML='🎓'} /> : '🎓'}
              </div>
              <div className="course-meta">
                <div className="course-title" id="course-title">{title}</div>
                <div className="course-tags">
                  <span className="tag free-tag">100% FREE</span>
                  <span className="tag" id="course-cat">{cat}</span>
                </div>
                <div className="course-price">
                  {price && <s id="course-price-original">{price}</s>}
                  <span className="free" id="free-label">
                    {left ? `🔥 ${left} left` : (price ? '→ FREE with coupon' : '🆓 FREE with coupon')}
                  </span>
                </div>
              </div>
            </div>

            <div className="unlock-headline">
              <h2>🔓 Unlock Your Free Course</h2>
            </div>

            <div className="ad-notice" id="ad-notice">
              📋 <strong>How it works:</strong> Click <strong>Visit</strong> → view the advertiser page for a few seconds → come back here and the next step unlocks <strong>automatically</strong>.
            </div>

            <div className="progress-wrap">
              <div className="progress-bar-bg">
                <div className="progress-bar-fill" id="progress-fill" style={{width: progressWidth}}></div>
              </div>
              <span className="progress-label" id="progress-label">{doneCount}/2</span>
            </div>

            <div className="steps">
              <StepItem n={1} state={stepState} onStart={startStep} step1Done={stepState[1].done} />
              <StepItem n={2} state={stepState} onStart={startStep} step1Done={stepState[1].done} />
            </div>

            <button
              className={`cta-btn ${doneCount === 2 ? 'unlocked' : 'locked'}`}
              id="btn-enroll"
              disabled={doneCount !== 2}
              onClick={enrollNow}
            >
              {doneCount === 2 ? '🚀 Enroll Free Now' : '🔒 Complete both steps to enroll'}
            </button>

            <div className={`success-msg ${successVisible ? 'visible' : ''}`} id="success-msg">
              🎉 You're all set! Click above to enroll for free.
            </div>
          </div>
        )}

        <div className="tads-banner-section">
          <div id="tads-container-9636"></div>
        </div>

        <div className="encyclo-section">
          <a className="encyclo-banner" href="https://helloencyclo.com/?ref=HUSSEINSHEIKHO" target="_blank" rel="noopener">
            <div className="encyclo-icon">🎓</div>
            <div className="encyclo-text">
              <div className="encyclo-title">Join HelloEncyclo Grant</div>
              <div className="encyclo-sub">Free scholarship to learn Programming & AI</div>
            </div>
            <span className="encyclo-arrow">Join →</span>
          </a>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

<canvas id="confetti-canvas"></canvas>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Udemy Free Course Access</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://w.tads.me/widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --udemy-purple:   #5624d0;
      --udemy-purple-2: #401b9c;
      --udemy-yellow:   #f4c150;
      --udemy-yellow-dk:#e59819;
      --bg:             #f7f9fc;
      --card:           #ffffff;
      --text:           #1c1d1f;
      --text-muted:     #6a6f73;
      --border:         #e8ecef;
      --step-done-bg:   #e6f4ea;
      --step-done-text: #1e7e34;
      --radius-card:    20px;
      --radius-btn:     10px;
      --shadow-card:    0 4px 24px rgba(86, 36, 208, 0.10);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Mulish', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 32px;
    }

    /* ── Top banner ── */
    .top-bar {
      width: 100%;
      background: var(--udemy-purple);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar .logo-u {
      width: 32px; height: 32px;
      background: var(--udemy-yellow);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: var(--udemy-purple);
      flex-shrink: 0;
    }
    .top-bar .logo-text {
      font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 0.2px;
    }
    .top-bar .badge-free {
      margin-left: auto;
      background: var(--udemy-yellow);
      color: var(--udemy-purple);
      font-size: 11px; font-weight: 800;
      padding: 4px 10px; border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* ── Main card ── */
    .card {
      width: calc(100% - 28px);
      max-width: 440px;
      margin: 20px auto 0;
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 22px 20px 20px;
      animation: slideUp .45s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Course info row ── */
    .course-info {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .course-thumb {
      width: 64px; height: 64px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--udemy-purple) 0%, #8b5cf6 100%);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }
    .course-thumb img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
    }
    .course-meta { flex: 1; min-width: 0; }
    .course-meta .course-title {
      font-size: 14px; font-weight: 800; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .course-tags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .tag {
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 5px;
      background: #ede9f9; color: var(--udemy-purple);
    }
    .tag.free-tag {
      background: var(--udemy-yellow);
      color: #5a3a00;
    }
    .course-price {
      font-size: 12px; font-weight: 800;
      margin-top: 6px; color: var(--text-muted);
    }
    .course-price s { color: #9aa0a6; font-weight: 600; }
    .course-price .free { color: #1e7e34; font-size: 14px; margin-left: 4px; }

    /* ── Headline ── */
    .unlock-headline {
      text-align: center;
      margin-bottom: 6px;
    }
    .unlock-headline h2 {
      font-size: 17px; font-weight: 900; color: var(--text);
      line-height: 1.3;
    }
    .unlock-headline p {
      font-size: 12px; color: var(--text-muted);
      margin-top: 4px; line-height: 1.5;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      margin: 14px 0;
      display: flex; align-items: center; gap: 10px;
    }
    .progress-bar-bg {
      flex: 1; height: 7px; background: var(--border); border-radius: 10px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--udemy-purple), #8b5cf6);
      border-radius: 10px;
      width: 0%;
      transition: width .5s ease;
    }
    .progress-label {
      font-size: 12px; font-weight: 800; color: var(--udemy-purple);
      min-width: 30px; text-align: right;
    }

    /* ── Steps ── */
    .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }

    .step {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      transition: border-color .3s, background .3s;
    }
    .step.locked { opacity: .5; pointer-events: none; }
    .step.done {
      border-color: #c3e6cb;
      background: var(--step-done-bg);
    }

    .step-num {
      width: 36px; height: 36px; border-radius: 50%;
      background: #ede9f9; color: var(--udemy-purple);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; flex-shrink: 0;
      transition: background .3s, color .3s;
    }
    .step.done .step-num {
      background: var(--step-done-text); color: #fff; font-size: 18px;
    }

    .step-body { flex: 1; min-width: 0; }
    .step-title { font-size: 14px; font-weight: 800; color: var(--text); }
    .step.done .step-title { color: var(--step-done-text); }
    .step-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .step-btn {
      background: var(--udemy-purple);
      color: #fff; border: none;
      border-radius: var(--radius-btn);
      padding: 8px 16px;
      font-size: 13px; font-weight: 800;
      cursor: pointer; flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    .step-btn:active { transform: scale(.96); }
    .step-btn:disabled { background: #c8bfe7; cursor: not-allowed; }
    .step-btn.counting {
      background: #f59e0b;
      pointer-events: none;
      min-width: 64px;
    }
    .step-btn.done-mark {
      background: transparent;
      color: var(--step-done-text);
      font-size: 20px;
      pointer-events: none;
      padding: 0 12px;
    }

    /* ── Main CTA ── */
    .cta-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px; font-weight: 900;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .3s;
      letter-spacing: 0.2px;
    }
    .cta-btn.locked {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    .cta-btn.unlocked {
      background: linear-gradient(135deg, var(--udemy-yellow) 0%, var(--udemy-yellow-dk) 100%);
      color: #3d2c00;
      box-shadow: 0 6px 18px -4px rgba(244, 193, 80, .7);
      animation: pulseYellow 2.2s infinite;
    }
    @keyframes pulseYellow {
      0%  { box-shadow: 0 0 0 0 rgba(244,193,80,.45); }
      60% { box-shadow: 0 0 0 12px rgba(244,193,80,0); }
      100%{ box-shadow: 0 0 0 0 rgba(244,193,80,0); }
    }

    /* ── Sponsored banner block ── */
    .ad-section {
      width: calc(100% - 28px);
      max-width: 440px;
      margin: 16px auto 0;
    }
    .ad-label {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .8px;
      text-align: center; margin-bottom: 8px;
    }
    .ad-slot {
      width: 100%; min-height: 80px;
      border-radius: 14px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--card);
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }
    .ad-slot:empty { display: none; }

    /* ── TGB ad container ── */
    #tads-container-9636 {
      width: 100%;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tads-container-9636:empty { display: none; }

    /* ── Timer overlay on step ── */
    .timer-ring {
      font-size: 12px; font-weight: 800;
      color: #f59e0b;
    }

    /* ── Responsive ── */
    @media (max-width: 380px) {
      .card { padding: 16px 14px; }
      .step-btn { padding: 7px 12px; font-size: 12px; }
      .cta-btn { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo-u">u</div>
    <span class="logo-text">UdemySY Free Courses</span>
    <span class="badge-free">FREE</span>
  </div>

  <!-- Main card -->
  <div class="card">

    <!-- Course info -->
    <div class="course-info">
      <div class="course-thumb" id="course-thumb">🎓</div>
      <div class="course-meta">
        <div class="course-title" id="course-title">Loading course…</div>
        <div class="course-tags">
          <span class="tag free-tag">100% FREE</span>
          <span class="tag" id="course-cat">Udemy</span>
        </div>
        <div class="course-price">
          <s id="course-price-original"></s>
          <span class="free">→ FREE with coupon</span>
        </div>
      </div>
    </div>

    <!-- Headline -->
    <div class="unlock-headline">
      <h2>Unlock Your Free Course</h2>
      <p>Watch 2 short ads to activate your free enrollment link.</p>
    </div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label">0/2</span>
    </div>

    <!-- Steps -->
    <div class="steps">

      <!-- Step 1 -->
      <div class="step" id="step-1">
        <div class="step-num" id="num-1">1</div>
        <div class="step-body">
          <div class="step-title">Watch Ad #1</div>
          <div class="step-sub">~10 seconds • tads.me</div>
        </div>
        <button class="step-btn" id="btn-1" onclick="startStep(1)">Watch</button>
      </div>

      <!-- Step 2 -->
      <div class="step locked" id="step-2">
        <div class="step-num" id="num-2">2</div>
        <div class="step-body">
          <div class="step-title">Watch Ad #2</div>
          <div class="step-sub">~10 seconds • tads.me</div>
        </div>
        <button class="step-btn" id="btn-2" onclick="startStep(2)" disabled>Watch</button>
      </div>

    </div>

    <!-- CTA -->
    <button class="cta-btn locked" id="btn-enroll" disabled>
      🔒 Complete both steps to enroll
    </button>

  </div>

  <!-- Bottom TGB banner ad -->
  <!-- tads.me requires div with id="tads-container-{WIDGET_ID}" to render the banner -->
  <div class="ad-section" id="ad-section-wrapper">
    <div class="ad-label">Sponsored</div>
    <div class="ad-slot">
      <div id="tads-container-9636"></div>
    </div>
  </div>

  <script>
    // ── Telegram WebApp init ──────────────────────────────────────
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); }

    // ── Widget IDs ───────────────────────────────────────────────
    const FULLSCREEN_ID_1 = "9579";   // Step 1 – tads fullscreen
    const FULLSCREEN_ID_2 = "9966";   // Step 2 – separate widget for second impression
    const TGB_ID          = "9636";   // Bottom TGB banner

    // ── Course URL from startapp param ───────────────────────────
    function getCourseUrl() {
      const param = tg?.initDataUnsafe?.start_param
                 || new URLSearchParams(window.location.search).get('startapp')
                 || new URLSearchParams(window.location.search).get('tgWebAppStartParam');
      if (!param) return 'https://www.udemy.com/';
      try {
        // base64url → base64 → decode
        const b64 = param.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = decodeURIComponent(escape(atob(b64)));
        return decoded.startsWith('http') ? decoded : 'https://www.udemy.com/';
      } catch(e) { return 'https://www.udemy.com/'; }
    }

    // ── Extract course display data from URL (optional meta param) ─
    function getCourseDisplayData() {
      const titleParam = new URLSearchParams(window.location.search).get('title');
      const imgParam   = new URLSearchParams(window.location.search).get('img');
      const catParam   = new URLSearchParams(window.location.search).get('cat');
      const priceParam = new URLSearchParams(window.location.search).get('price');
      return {
        title: titleParam ? decodeURIComponent(titleParam) : null,
        img:   imgParam   ? decodeURIComponent(imgParam)   : null,
        cat:   catParam   ? decodeURIComponent(catParam)   : null,
        price: priceParam ? decodeURIComponent(priceParam) : null,
      };
    }

    const COURSE_URL = getCourseUrl();
    const meta       = getCourseDisplayData();

    // Populate course info if data available
    if (meta.title) {
      document.getElementById('course-title').textContent = meta.title;
    }
    if (meta.img) {
      const thumb = document.getElementById('course-thumb');
      thumb.innerHTML = `<img src="${meta.img}" alt="course" onerror="this.parentElement.innerHTML='🎓'" />`;
    }
    if (meta.cat) {
      document.getElementById('course-cat').textContent = meta.cat;
    }
    if (meta.price) {
      document.getElementById('course-price-original').textContent = meta.price;
    }

    // ── State ────────────────────────────────────────────────────
    let step1Done     = false;
    let step2Done     = false;
    let adController1 = null;
    let adController2 = null;
    let adPlaying     = false;
    let countdownTimer = null;

    // ── Init tads controllers ────────────────────────────────────
    function waitForTads(cb) {
      if (window.tads && typeof window.tads.init === 'function') { cb(); return; }
      const t = setInterval(() => {
        if (window.tads && typeof window.tads.init === 'function') {
          clearInterval(t); cb();
        }
      }, 80);
    }

    function initAdControllers() {
      // Controller for step 1
      adController1 = window.tads.init({
        widgetId: FULLSCREEN_ID_1,
        type: 'fullscreen',
        debug: false,
        onShowReward: () => onAdComplete(1),
        onAdsNotFound: () => onAdFallback(1),
        onError: () => onAdFallback(1),
      });

      // Controller for step 2 (separate instance so ads fire independently)
      adController2 = window.tads.init({
        widgetId: FULLSCREEN_ID_2,
        type: 'fullscreen',
        debug: false,
        onShowReward: () => onAdComplete(2),
        onAdsNotFound: () => onAdFallback(2),
        onError: () => onAdFallback(2),
      });
    }

    function hideTGBSection() {
      const wrapper = document.getElementById('ad-section-wrapper');
      if (wrapper) wrapper.style.display = 'none';
    }

    function initTGBBanner() {
      // tads.me renders into <div id="tads-container-9636"> which is already in DOM
      const tgbController = window.tads.init({
        widgetId: TGB_ID,   // "9636"
        type: 'static',
        debug: false,
        onAdsNotFound: hideTGBSection,
      });
      if (tgbController && typeof tgbController.loadAd === 'function') {
        tgbController.loadAd()
          .then(() => tgbController.showAd())
          .catch(hideTGBSection);
      }
    }

    window.addEventListener('load', () => {
      waitForTads(() => {
        initAdControllers();
        initTGBBanner();
      });
    });

    // ── Step logic ───────────────────────────────────────────────
    function startStep(n) {
      if (adPlaying) return;
      if (n === 1 && step1Done) return;
      if (n === 2 && (!step1Done || step2Done)) return;

      adPlaying = true;

      const btn = document.getElementById(`btn-${n}`);
      btn.classList.add('counting');
      btn.textContent = '⏳';

      const controller = n === 1 ? adController1 : adController2;

      if (!controller) {
        // tads not ready yet — fallback after short wait
        setTimeout(() => onAdFallback(n), 1200);
        return;
      }

      controller.showAd().catch(() => onAdFallback(n));

      // safety net: if tads callback never fires within 20s, auto-complete
      const safetyTimer = setTimeout(() => {
        if (adPlaying) {
          console.warn(`Step ${n}: safety net triggered`);
          onAdComplete(n);
        }
      }, 20000);

      // store so we can clear if callback fires first
      window[`_safety_${n}`] = safetyTimer;
    }

    function onAdComplete(n) {
      clearTimeout(window[`_safety_${n}`]);
      if (!adPlaying && ((n === 1 && step1Done) || (n === 2 && step2Done))) return;
      adPlaying = false;

      const btn  = document.getElementById(`btn-${n}`);
      const step = document.getElementById(`step-${n}`);
      const num  = document.getElementById(`num-${n}`);

      btn.classList.remove('counting');
      btn.className = 'step-btn done-mark';
      btn.textContent = '✓';
      step.classList.add('done');
      num.textContent = '✓';

      if (n === 1) {
        step1Done = true;
        updateProgress();

        // Unlock step 2 with a short delay ensuring ~2 ad impressions minimum
        setTimeout(() => {
          const s2   = document.getElementById('step-2');
          const btn2 = document.getElementById('btn-2');
          s2.classList.remove('locked');
          btn2.disabled = false;
        }, 800);

      } else {
        step2Done = true;
        updateProgress();
        unlockEnroll();
      }
    }

    function onAdFallback(n) {
      console.warn(`Ad ${n} unavailable — using fallback`);
      setTimeout(() => onAdComplete(n), 1000);
    }

    function updateProgress() {
      const done = (step1Done ? 1 : 0) + (step2Done ? 1 : 0);
      document.getElementById('progress-fill').style.width  = `${done * 50}%`;
      document.getElementById('progress-label').textContent = `${done}/2`;
    }

    function unlockEnroll() {
      const btn = document.getElementById('btn-enroll');
      btn.disabled = false;
      btn.className = 'cta-btn unlocked';
      btn.innerHTML = '🚀 Enroll Free Now';
    }

    // ── Open course ───────────────────────────────────────────────
    function enrollNow() {
      if (!step1Done || !step2Done) return;
      if (tg?.openLink) {
        tg.openLink(COURSE_URL);
        setTimeout(() => tg.close(), 800);
      } else {
        window.open(COURSE_URL, '_blank');
      }
    }

    document.getElementById('btn-enroll').addEventListener('click', enrollNow);
  </script>

</body>
</html>

  <!-- Deep-link routing (unchanged behaviour).
       • px_<payload>            → dl.html (Pixel library)
       • wallet | board | me     → stay here and open that tab
       • anything else           → details.html (course deep link)
       Route only on the first active launch of a session. -->
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var qs = new URLSearchParams(window.location.search);
      var startParam =
        qs.get('startapp') ||
        qs.get('tgWebAppStartParam') ||
        (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);

      if (!startParam) return;

      if (startParam.indexOf('px_') === 0) {
        var pixelPayload = startParam.slice(3);
        if (pixelPayload) {
          window.location.replace('dl.html?startapp=' + encodeURIComponent(pixelPayload));
        }
        return;
      }

      var TABS = { wallet: 'earn', earn: 'earn', board: 'board', me: 'me', profile: 'me' };
      if (TABS[startParam]) { window.__startTab = TABS[startParam]; return; }

      try {
        var key = 'udemy_deeplink_' + startParam;
        var now = Date.now();
        var previous = sessionStorage.getItem(key);
        var previousAt = previous ? Number(previous) : 0;
        if (previousAt && (now - previousAt) < 60000) return;
        sessionStorage.setItem(key, String(now));
      } catch (e) {}

      window.location.replace('details.html?startapp=' + encodeURIComponent(startParam));
    })();
  </script>

  <style>
  :root {
    --bg:#09090b; --surface:#17171b; --surface-2:#1e1e23; --surface-3:#26262d;
    --text:#f8f5f6; --muted:#aaa3a7; --faint:#7d777a;
    --border:rgba(255,255,255,.09);
    --wine:#7b1733; --wine-bright:#a51f46; --wine-soft:rgba(165,31,70,.14); --rose:#d96a88;
    --gold:#d8ad67; --gold-soft:rgba(216,173,103,.12); --success:#56c596; --danger:#d95368;
    --r-xl:28px; --r-lg:20px; --r-md:15px; --r-sm:11px;
    --shadow:0 24px 70px rgba(0,0,0,.45); --shadow-wine:0 12px 30px rgba(123,23,51,.32);
    --safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
    --safe-bottom:calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));

    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --nav-h:64px;

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{width:100%;min-height:100%;background:var(--bg);overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:var(--font);width:100%;min-height:100dvh;color:var(--text);
    background:radial-gradient(circle at 50% -15%,rgba(165,31,70,.24),transparent 38%),
               radial-gradient(circle at 100% 35%,rgba(123,23,51,.12),transparent 30%),
               linear-gradient(180deg,#08080a 0%,#0d0d10 48%,#08080a 100%);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
  input{font:inherit;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
  svg{display:block}
  .ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .app-shell{
    width:min(100%,500px);margin:0 auto;min-height:100dvh;background:var(--surface);position:relative;
    box-shadow:var(--shadow);
    padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 22px);
  }
  @media (min-width:640px){ body{padding:24px 14px 40px} .app-shell{border-radius:var(--r-xl);min-height:0;overflow:hidden} }

    background:radial-gradient(circle at 82% 18%,rgba(217,106,136,.20),transparent 27%),
               radial-gradient(circle at 12% 65%,rgba(165,31,70,.28),transparent 35%),
               linear-gradient(135deg,#240914 0%,#100b0e 56%,#08080a 100%);

  .avatar{
    --h:345;position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;
    width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px;

    border:1.5px solid rgba(216,173,103,.55);

  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .avatar.sm{width:34px;height:34px;font-size:12px;border-width:1px}
  .top-copy{min-width:0;flex:1}

  .btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}

  .search{
    display:flex;align-items:center;gap:9px;padding:0 14px;height:46px;margin-bottom:10px;border-radius:14px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--muted);

  .search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--text)}

  .cat-bar{display:flex;gap:8px;margin:0 -16px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface-2);
    border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;transition:background .15s,color .15s,transform .1s;

  .cat-chip:active{transform:scale(.95)}
  .cat-chip.active{background:linear-gradient(135deg,var(--wine-bright),var(--wine));border-color:rgba(217,106,136,.55);color:#fff;box-shadow:0 6px 18px rgba(165,31,70,.32)}

  .grid{display:grid;grid-template-columns:1fr;gap:10px}

  .course-body{flex:1;min-width:0;display:flex;flex-direction:column;padding-right:30px}
  .course-title{font-size:13px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#f6f2f3}

  .heart{
    position:absolute;top:6px;right:6px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--faint);
    transition:color .15s,transform .15s;

  .heart svg{width:18px;height:18px}
  .heart.on{color:var(--rose)}
  .heart.on svg{fill:var(--rose)}
  .heart:active{transform:scale(.85)}

  .skel-card{display:flex;gap:12px;padding:11px;border:1px solid var(--border);border-radius:17px;background:rgba(255,255,255,.025)}
  .skel-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px}

  .link-row small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .link-row .ico{color:#ef9ab0;flex:0 0 auto}
  .link-row .chev{margin-left:auto;color:var(--faint);width:16px;height:16px}

  .saved-card{display:flex;align-items:center;gap:11px;padding:9px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer}
  .saved-card .course-thumb{width:52px;height:52px;flex-basis:52px;border-radius:11px;font-size:20px}
  .saved-card .t{flex:1;min-width:0;font-size:12px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .saved-card .t small{display:block;margin-top:3px;font-size:10px;font-weight:700;color:var(--muted)}
  .saved-card .t small.ended{color:var(--danger)}

  /* ───────── Tab bar ───────── */
  .tabbar{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(100%,500px);display:grid;grid-template-columns:repeat(4,1fr);
    padding:8px 10px calc(8px + var(--safe-bottom));background:rgba(14,14,17,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:13px;color:var(--faint);font-size:10.5px;font-weight:700;transition:color .15s}

  .tab.active{color:#fff}
  .tab.active .ico{color:var(--rose)}
  .tab.active::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--wine-bright),var(--gold))}
  .tab{position:relative}

  /* ───────── Toast ───────── */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);transform:translate(-50%,20px);z-index:60;max-width:min(92vw,420px);
    padding:11px 16px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.35;text-align:center;opacity:0;pointer-events:none;
    background:#241118;border:1px solid rgba(216,173,103,.4);color:#f3e3c3;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:opacity .22s,transform .22s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(217,83,104,.5);color:#f5c6cf}
  .fly{position:fixed;z-index:70;pointer-events:none;font-weight:800;font-size:18px;color:#ecca8f;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:fly 1.1s ease-out forwards}
  @keyframes fly{from{opacity:1;transform:translate(-50%,0) scale(.9)}to{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}

  @media (max-width:380px){
    .ring{width:98px;height:98px;flex-basis:98px}.ring svg{width:98px;height:98px}.ring-c b{font-size:22px}
    .pass-copy h2{font-size:18px}.course-thumb{width:72px;height:72px;flex-basis:72px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  }
  </style>
</head>
<body>

<div class="app-shell" id="app">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════
     Config
     ══════════════════════════════════════════════════════════════ */
  const tg = window.Telegram && window.Telegram.WebApp;
  const INIT_DATA = (tg && tg.initData) || '';
  const TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

  const BOT_USERNAME = 'UdemySybot';
  const CHANNEL_URL  = 'https://t.me/Udemy26';
  const WHATSAPP_URL = 'https://whatsapp.com/channel/0029VaC7Weq29753hpcggW2A';
  const GOAL_DEFAULT = 10000;

  // Udemy interstitial — Adsgram unit int-46421
  const ADSGRAM_BLOCK_ID = 'int-46421';
  const WELCOME_AD_KEY = 'udemy_interstitial_shown';

  const SUPABASE_URL = "https://wqnxyxrbtvmasuvdogrg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_63UWVbOlukOiUqsmtfQ9Jw_Go1dV3tt";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ── Telegram shell setup ── */
  if (tg) {
    try {
      tg.ready();
      if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#09090b');
      if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#09090b');
      if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor('#0e0e11');
      if (typeof tg.disableClosingConfirmation === 'function') tg.disableClosingConfirmation();
    } catch (e) {}
  }
  (function viewportSync() {
    if (!tg) return;
    const root = document.documentElement;
    const px = v => Math.max(0, Number(v) || 0) + 'px';
    function sync() {
      const s = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
      root.style.setProperty('--tg-safe-area-inset-top', px(s.top));
      root.style.setProperty('--tg-safe-area-inset-bottom', px(s.bottom));
      root.style.setProperty('--tg-content-safe-area-inset-top', px(c.top));
      root.style.setProperty('--tg-content-safe-area-inset-bottom', px(c.bottom));
    }
    sync();
    if (typeof tg.onEvent === 'function') {
      ['viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged'].forEach(ev => tg.onEvent(ev, sync));
    }
  })();

  /* ── Tiny helpers ── */
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const fmt = n => Number(n || 0).toLocaleString('en-US');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const haptic = (kind) => { try { tg && tg.HapticFeedback && (kind === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged()); } catch (e) {} };

  const DEBUG = new URLSearchParams(window.location.search).get('debug') === '1';
  function debugLog(...args) {
    console.log('[MiniApp]', ...args);
    if (!DEBUG) return;
    let box = $('__debug_box');
    if (!box) {
      box = document.createElement('div'); box.id = '__debug_box';
      box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:rgba(0,0,0,.88);color:#7CFC7C;font:11px monospace;padding:8px;z-index:99999;white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    const line = document.createElement('div');
    line.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
    box.appendChild(line);
  }

  let toastTimer = null;
  function toast(msg, isErr) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function hueOf(str) { let h = 0; for (const ch of String(str || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return 330 + (h % 70); }
  function initialsOf(name) {
    const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
    return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }
  function avatarHTML(name, photo, size) {
    const img = photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" />` : '';
    return `<span class="avatar ${size || ''}" style="--h:${hueOf(name) % 360}">${esc(initialsOf(name))}${img}</span>`;
  }

  /* ── Server calls (every RPC is verified server-side with Telegram initData) ── */
  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw error;
    return data;
  }

  /* ══════════════════════════════════════════════════════════════
     Category buckets (unchanged mapping)
     ══════════════════════════════════════════════════════════════ */
    const CATEGORY_BUCKETS = [
      { id: 'programming', label: 'Programming', emoji: '💻',
        keywords: ['python','javascript','java','c++','c#','php','sql','golang',' go ','ruby',
                   'swift','kotlin','typescript','programming','coding','developer','software development',
                   'react','node','django','flutter','android','ios development',
                   // Specific real Udemy sub-categories under "Development" — kept
                   // specific (not the bare word "development") so they never
                   // shadow "Web Development" below, which must win on its own.
                   'mobile development','game development','software testing',
                   'programming languages','no-code development','database design',
                   'software engineering'] },
      { id: 'ai', label: 'AI & ML', emoji: '🤖',
        keywords: ['artificial intelligence',' ai ','chatgpt','machine learning','deep learning',
                   'neural network','openai','llm','generative ai','nlp','computer vision'] },
      { id: 'data', label: 'Data & Analytics', emoji: '📊',
        keywords: ['data science','data analysis','data analytics','power bi','tableau','excel',
                   'big data','data engineering','statistics','pandas','data visualization'] },
      { id: 'web', label: 'Web Development', emoji: '🌐',
        keywords: ['web development','wordpress','html','css','frontend','front-end','backend',
                   'back-end','full stack','fullstack'] },
      { id: 'business', label: 'Business & Marketing', emoji: '📈',
        keywords: ['business','marketing','sales','entrepreneurship','finance','accounting',
                   'seo','social media','e-commerce','management','excel'] },
      { id: 'design', label: 'Design', emoji: '🎨',
        keywords: ['design','photoshop','illustrator','figma','ui/ux','ui ','ux ','graphic',
                   'video editing','3d','animation'] },
      { id: 'it', label: 'IT & Software', emoji: '🛡️',
        keywords: ['cyber security','cybersecurity','network','it certification','cloud','aws',
                   'azure','devops','linux','ethical hacking',
                   // Udemy's own top-level "IT & Software" category and sub-categories.
                   'it & software','network & security','hardware','operating system'] },
      { id: 'personal', label: 'Personal Development', emoji: '🌱',
        keywords: ['personal development','productivity','language','language learning',
                   'health','fitness','music','photography','teaching'] },
    ];

    // Classify one course's raw category string into a bucket id.
    // Falls back to 'other' when nothing matches (still browsable via
    // the "All" chip, just without its own dedicated chip unless it's
    // the only thing present).
    function classifyCategory(rawCategory) {
      if (!rawCategory || rawCategory === 'N/A') return 'other';
      const c = ' ' + rawCategory.toLowerCase() + ' ';
      for (const bucket of CATEGORY_BUCKETS) {
        if (bucket.keywords.some(kw => c.includes(kw))) return bucket.id;
      }
      // Fallback pass: Udemy's bare top-level "Development" category
      // (with no sub-category detail) would otherwise wrongly shadow
      // "Web Development" if checked in the main loop above — so it's
      // only tried here, after every specific bucket already had its
      // chance to match.
      if (c.includes('development')) return 'programming';
      return 'other';
    }

  /* ══════════════════════════════════════════════════════════════
     Deep-link payload for details.html (unchanged)
     ══════════════════════════════════════════════════════════════ */
    function b64urlEncode(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function buildStartParam(course) {
      const payload = { u: course.udemy_url || course.detail_url };
      if (course.title)            payload.t = course.title.slice(0, 70);
      if (course.image_url)        payload.i = course.image_url;
      if (course.category && course.category !== 'N/A') payload.c = course.category.slice(0, 30);
      if (course.price_str)        payload.p = course.price_str.replace(/<[^>]+>/g, '');
      if (course.enrollments_left && !['N/A', '0', ''].includes(course.enrollments_left)) {
        payload.l = course.enrollments_left;
      }
      let encoded = b64urlEncode(JSON.stringify(payload));
      // Same 512-char safety trim as the bot, in the same drop order.
      const tryEncode = (p) => b64urlEncode(JSON.stringify(p));
      if (encoded.length > 512) { delete payload.i; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.c; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.p; encoded = tryEncode(payload); }
      if (encoded.length > 512 && payload.t) { payload.t = payload.t.slice(0, 30); encoded = tryEncode(payload); }
      if (encoded.length > 512) { encoded = tryEncode({ u: payload.u }); }
      return encoded;
    }

  function openCourse(course) {
    window.location.href = 'details.html?startapp=' + buildStartParam(course);
  }

  /* ══════════════════════════════════════════════════════════════
     State
     ══════════════════════════════════════════════════════════════ */
  let allCourses = [];
  let activeCategory = 'all';
  let query = '';
  let dash = { ok: false };
  let savedSet = new Set();
  let board = null;
  let currentTab = 'discover';
  let adPlaying = false;
  let rewardsError = false;

  const userName = TG_USER ? (TG_USER.first_name || TG_USER.username || 'Learner') : 'Guest';
  const goal = () => (dash.ok && dash.goal) || GOAL_DEFAULT;
  const total = () => (dash.ok ? dash.total : 0);

  /* ══════════════════════════════════════════════════════════════
     Header
     ══════════════════════════════════════════════════════════════ */
  function renderHeader() {
    $('hdr-avatar').innerHTML = avatarHTML(userName, TG_USER && TG_USER.photo_url, '');
    $('hdr-title').textContent = TG_USER ? 'Hi, ' + userName : 'Daily Udemy Coupons';
    const n = allCourses.length ? allCourses.length + (window.__totalCount > allCourses.length ? '+' : '') : null;
    $('hdr-sub').textContent = n ? n + ' free courses live right now' : 'Fresh free courses, every day';
    animateNumber($('hdr-bal-n'), total());
    renderGoalStrip();
  }

  let shownBal = 0;
  function animateNumber(el, to) {
    const from = Number(el.dataset.v || 0);
    el.dataset.v = to;
    if (reduceMotion || from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 700;
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(from + (to - from) * e));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function renderGoalStrip() {
    const g = goal(), t = total();
    $('gs-n').textContent = fmt(t);
    $('gs-of').textContent = 'of ' + fmt(g) + ' pts to the paid channel';
    $('gs-bar').style.width = Math.min(100, t / g * 100) + '%';
    const btn = $('gs-watch');
    const capped = dash.ok && dash.ads_today >= dash.ads_cap;
    btn.disabled = capped;
    btn.lastChild.textContent = '+' + ((dash.ok && dash.ad_reward) || 15);
  }

  /* ══════════════════════════════════════════════════════════════
     Discover — course feed (fetch logic unchanged)
     ══════════════════════════════════════════════════════════════ */
  const gridEl = $('grid');
  const catBarEl = $('cat-bar');

  function renderCatBar() {
    const counts = {};
    allCourses.forEach(c => { const b = classifyCategory(c.category); counts[b] = (counts[b] || 0) + 1; });
    const chips = [{ id: 'all', label: 'All', emoji: '✨', count: allCourses.length }];
    CATEGORY_BUCKETS.forEach(b => { if (counts[b.id]) chips.push({ id: b.id, label: b.label, emoji: b.emoji, count: counts[b.id] }); });
    if (counts.other) chips.push({ id: 'other', label: 'Other', emoji: '🗂️', count: counts.other });
    if (chips.length < 3) { catBarEl.style.display = 'none'; return; }
    catBarEl.style.display = 'flex';
    catBarEl.innerHTML = chips.map(ch => `
      <button class="cat-chip${ch.id === activeCategory ? ' active' : ''}" data-act="cat" data-cat="${esc(ch.id)}">
        <span>${ch.emoji}</span><span>${esc(ch.label)}</span><span class="chip-count">${ch.count}</span>
      </button>`).join('');
  }

  function renderEmpty(message, sub, withRetry) {
    gridEl.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🎓</div>
        <h3>${esc(message)}</h3>
        <p>${esc(sub)}</p>
        ${withRetry ? '<button class="btn btn-primary" data-act="retry">Retry</button>' : ''}
      </div>`;
  }

  function courseCardHTML(c, idx) {
    const img = c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy" onerror="this.parentElement.textContent='🎓'" />` : '🎓';
    const catTag = (c.category && c.category !== 'N/A') ? `<span class="tag">${esc(c.category)}</span>` : '';
    const leftTag = (c.enrollments_left && !['N/A', '0', ''].includes(c.enrollments_left)) ? `<span class="tag left-tag">🔥 ${esc(c.enrollments_left)} left</span>` : '';
    const rating = (c.rating && !['N/A', '0', ''].includes(String(c.rating))) ? `<span><span class="star">★</span> ${esc(c.rating)}</span>` : '';
    const students = (c.students && !['N/A', '0', ''].includes(String(c.students))) ? `<span>${esc(c.students)} learners</span>` : '';
    const saved = savedSet.has(c.detail_url);
    return `

      (!q || (c.title || '').toLowerCase().includes(q) || (c.category || '').toLowerCase().includes(q)));
    if (!allCourses.length) return;
    if (!visibleList.length) {
      renderEmpty(q ? 'No matches' : 'No courses in this category yet',

  async function loadCourses() {
    $('hdr-sub').textContent = 'Loading courses…';
    try {
      // Merged from two independent source tables — the catalog is one unified feed.
      const [r1, r2] = await Promise.all([
        sb.from('courses').select('*', { count: 'exact' })
          .eq('is_active', true).order('created_at', { ascending: false }).limit(60),
        sb.from('courses_udemyxpert').select('*', { count: 'exact' })
          .eq('is_active', true).order('created_at', { ascending: false }).limit(60),
      ]);
      if (r1.error) throw r1.error;
      if (r2.error) throw r2.error;

      const data = [...(r1.data || []), ...(r2.data || [])]
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 60);
      const count = (r1.count || 0) + (r2.count || 0);

      if (!data.length) {
        renderEmpty('No courses right now', 'New free courses are added throughout the day — check back soon.', true);
        renderHeader();
        return;
      }
      allCourses = data;
      window.__totalCount = count;
      activeCategory = 'all';
      renderCatBar();
      renderGrid();
      renderHeader();
    } catch (err) {
      console.error(err);
      $('hdr-sub').textContent = 'Could not load courses';
      renderEmpty('Could not load courses', 'Check your connection and try again.', true);
    }
  }

  async function toggleSave(course) {
    if (!INIT_DATA) { toast('Open this app inside Telegram to save courses.', true); return; }
    const url = course.detail_url;
    const want = !savedSet.has(url);
    want ? savedSet.add(url) : savedSet.delete(url);       // optimistic
    haptic();
    refreshHearts();
    if (currentTab === 'me') renderMe();
    try {
      const r = await rpc('miniapp_toggle_save', { p_init_data: INIT_DATA, p_detail_url: url, p_save: want });
      if (!r || !r.ok) throw new Error((r && r.reason) || 'failed');
      if (dash.ok) dash.saved = savedSet.size;
      toast(want ? '❤️ Saved to your library' : 'Removed from saved');
    } catch (e) {
      want ? savedSet.delete(url) : savedSet.add(url);     // roll back
      refreshHearts();
      toast('Could not update saved courses. Try again.', true);
    }
  }
  function refreshHearts() {
    gridEl.querySelectorAll('.heart').forEach(el => {
      const c = visibleList[Number(el.dataset.idx)];
      if (!c) return;
      const on = savedSet.has(c.detail_url);
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on);
    });
  }

    if (!INIT_DATA) { toast('Open this app inside Telegram to earn points.', true); return; }
    try {
      const r = await rpc('miniapp_claim_ad', { p_init_data: INIT_DATA, p_placement: placement });

  function flyPoints(text, srcEl) {
    if (reduceMotion) return;
    const r = (srcEl || $('hdr-bal')).getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'fly'; el.textContent = text;
    el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }

  function watchAd(placement, srcEl) {
    if (adPlaying) return;
    if (dash.ok && dash.ads_today >= dash.ads_cap) { toast('Daily ad limit reached. Come back tomorrow!', true); return; }
    const ctrl = getAdController();
    if (!ctrl) { toast('Ads are unavailable right now. Try again in a moment.', true); return; }
    adPlaying = true;
    ctrl.show()
      .then(() => { adPlaying = false; claimAdPoints(placement, srcEl); })
      .catch(err => { adPlaying = false; console.warn('Adsgram show() failed', err); toast('No ad available right now — try again shortly.', true); });
  }

        ${I.chev}
      </div>

      <div class="sec-head"><h3 class="h2" style="font-size:15px">Saved courses</h3></div>
      <div class="saved-list" id="saved-list"><div class="skel-card"><div class="skel-thumb" style="width:52px;height:52px;flex-basis:52px"></div><div class="skel-lines"><div class="skel-line w60"></div></div></div></div>

      <div class="sec-head"><h3 class="h2" style="font-size:15px">Help &amp; community</h3></div>
      <div class="link-list">
        <button class="link-row" data-act="openbot" data-start="contact">${I.chat}<span>Contact the owner<small>Questions, ideas or problems — we reply in the bot</small></span>${I.chev}</button>
        <button class="link-row" data-act="share">${I.users}<span>Invite friends<small>+50 points for each new learner</small></span>${I.chev}</button>
        <button class="link-row" data-act="openbot" data-start="rewards">${I.bell}<span>Rewards in the bot<small>Balance, rank and daily quiz</small></span>${I.chev}</button>
        <button class="link-row" data-act="tglink" data-url="${esc(CHANNEL_URL)}">${I.tgram}<span>Telegram channel<small>New free courses the moment they drop</small></span>${I.chev}</button>
        <a class="link-row" href="${esc(WHATSAPP_URL)}" target="_blank" rel="noopener">${I.wa}<span>WhatsApp channel<small>Prefer WhatsApp? Follow along there</small></span>${I.chev}</a>
      </div>`;

    await loadSavedCourses();
    const list = $('saved-list');
    if (!list || currentTab !== 'me') return;
    if (!savedSet.size) {
      list.innerHTML = '<p class="note" style="padding:6px 2px">Tap the heart on any course to keep it here.</p>';
      return;
    }
    const live = savedCourses || [];
    const missing = savedSet.size - live.length;
    list.innerHTML = live.map((c, i) => {
      const img = c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy" onerror="this.parentElement.textContent='🎓'" />` : '🎓';
      const ended = c.is_active === false;
      return `<div class="saved-card" data-act="savedcourse" data-idx="${i}" role="button" tabindex="0">
        <div class="course-thumb">${img}</div>
        <div class="t">${esc(c.title)}<small class="${ended ? 'ended' : ''}">${ended ? 'Offer ended' : (c.category && c.category !== 'N/A' ? esc(c.category) : 'Free course')}</small></div>
        <button class="heart on" data-act="unsave" data-idx="${i}" aria-label="Remove from saved"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.2 5.5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2 3.2 0 5 3.1 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg></button>
      </div>`;
    }).join('') + (missing > 0 ? `<p class="note" style="padding:4px 2px">${missing} saved course${missing > 1 ? 's are' : ' is'} no longer listed.</p>` : '');
  }

  /* ══════════════════════════════════════════════════════════════
     Tabs + Telegram BackButton
     ══════════════════════════════════════════════════════════════ */
  function backHandler() { switchTab('discover'); }
  function switchTab(tab, silent) {
    currentTab = tab;
    ['discover', 'earn', 'board', 'me'].forEach(t => $('view-' + t).classList.toggle('active', t === tab));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (tab === 'earn') renderEarn();
    if (tab === 'board') { renderBoard(); loadBoard(); }
    if (tab === 'me') renderMe();
    if (!silent) { window.scrollTo({ top: 0 }); haptic(); }
    if (tg && tg.BackButton) {
      try {
        tg.BackButton.offClick(backHandler);
        if (tab !== 'discover') { tg.BackButton.onClick(backHandler); tg.BackButton.show(); }
        else tg.BackButton.hide();
      } catch (e) {}
    }
  }

  /* ══════════════════════════════════════════════════════════════
     Events (single delegated handler)
     ══════════════════════════════════════════════════════════════ */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    switch (act) {
      case 'tab': switchTab(t.dataset.tab); break;
      case 'cat': activeCategory = t.dataset.cat; renderCatBar(); renderGrid(); haptic(); break;
      case 'retry': gridEl.innerHTML = ''; loadCourses(); break;
      case 'retryboard': board = null; renderBoard(); loadBoard(); break;
      case 'course': { const c = visibleList[Number(t.dataset.idx)]; if (c) openCourse(c); break; }
      case 'save': { ev.stopPropagation(); const c = visibleList[Number(t.dataset.idx)]; if (c) toggleSave(c); break; }
      case 'savedcourse': { const c = (savedCourses || [])[Number(t.dataset.idx)]; if (c) openCourse(c); break; }
      case 'unsave': { ev.stopPropagation(); const c = (savedCourses || [])[Number(t.dataset.idx)]; if (c) { toggleSave(c).then(() => { savedFetchKey = ''; renderMe(); }); } break; }
      case 'watch': watchAd(currentTab === 'earn' ? 'earn' : 'home', t); break;
      case 'share': shareInvite(); break;
      case 'copy': copyInvite(); break;
      case 'openbot': openBot(t.dataset.start); break;
      case 'tglink': openTg(t.dataset.url); break;
    }
  });
  document.addEventListener('keydown', ev => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
  });
  $('search').addEventListener('input', e => { query = e.target.value; renderGrid(); });

  /* ══════════════════════════════════════════════════════════════
     Register / refresh this visitor in bot_users (unchanged RPC)
     Geolocation is looked up once per session instead of every open.
     ══════════════════════════════════════════════════════════════ */
  async function registerVisitor() {
    debugLog('initDataUnsafe.user =', TG_USER || null);
    if (!TG_USER || !TG_USER.id) { debugLog('registerVisitor: SKIPPED — not opened as a Telegram Mini App.'); return; }

    let countryCode = null, countryName = null;
    try {
      const cached = sessionStorage.getItem('udemy_geo');
      if (cached) { const g = JSON.parse(cached); countryCode = g.c; countryName = g.n; }
      else {
        const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
        if (geo && !geo.error) {
          countryCode = geo.country_code || null; countryName = geo.country_name || null;
          sessionStorage.setItem('udemy_geo', JSON.stringify({ c: countryCode, n: countryName }));
        }
      }
    } catch (e) { /* best-effort only */ }

    const { error } = await sb.rpc('register_mini_app_visitor', {
      p_chat_id: TG_USER.id, p_username: TG_USER.username || null, p_first_name: TG_USER.first_name || null,
      p_country_code: countryCode, p_country_name: countryName,
    });
    if (error) { console.error('registerVisitor: RPC failed:', error); debugLog('registerVisitor: RPC FAILED —', error.message || error); }
    else debugLog('registerVisitor: OK — chat_id', TG_USER.id);
  }

  /* ══════════════════════════════════════════════════════════════
     Boot
     ══════════════════════════════════════════════════════════════ */
  renderHeader();
  registerVisitor().then(() => { loadDashboard(); loadSaved(); });
  loadBoard();
  loadCourses().then(() => {
    if (window.__startTab) switchTab(window.__startTab, true);
    // Small delay so the catalog is visibly rendered before the ad.
    setTimeout(showWelcomeInterstitialOnce, 1200);
  });
  if (!window.__startTab) renderEarn();   // pre-build so the tab opens instantly
})();
</script>
</body>
</html>

  <style>
    :root {
      --primary:        #00aff0;
      --primary-dark:   #008ecf;
      --primary-deep:   #005f8e;
      --primary-light:  #e0f5fd;
      --accent:         #00c6ff;
      --bg:             #f0f9ff;
      --surface:        #ffffff;
      --text:           #0a2233;
      --text-secondary: #4a6a80;
      --text-muted:     #7a9aaa;
      --border:         #c5e8f8;
      --border-light:   #e0f2fa;
      --success-bg:     #e0f5fd;
      --success-text:   #005f8e;
      --radius-sm:      8px;
      --radius-md:      12px;
      --radius-lg:      16px;
      --radius-xl:      20px;
      --shadow-sm:      0 1px 3px rgba(0,175,240,.08);
      --shadow-md:      0 4px 16px rgba(0,175,240,.12);
      --shadow-lg:      0 8px 32px rgba(0,175,240,.18);
      --shadow-card:    0 2px 12px rgba(0,0,0,.06);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 481px) {
      body { padding: 16px; justify-content: center; }
      #root {
        min-height: auto;
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        background: var(--surface);
      }
    }

    .top-bar {
      background: linear-gradient(135deg, var(--primary-deep), var(--primary));
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 3px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo-box {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: var(--primary-deep);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .logo-text {
      font-size: 15px; font-weight: 800; color: #fff;
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.3px;

      background: var(--accent); color: #003d55;
      font-size: 11px; font-weight: 800;
      padding: 5px 12px; border-radius: 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    /* Skeleton */
    .skeleton-wrap {
      padding: 20px 16px;
      animation: fadeIn 0.3s ease;
    }
    .skel-row {
      display: flex; gap: 12px; margin-bottom: 20px;
    }
    .skel-thumb {
      width: 72px; height: 72px; border-radius: var(--radius-md);
      background: linear-gradient(90deg, var(--border-light) 25%, var(--primary-light) 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      flex-shrink: 0;
    }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
    .skel-line {
      height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, var(--border-light) 25%, var(--primary-light) 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;

      animation: shimmer 1.4s infinite;

      animation: shimmer 1.4s infinite;

      background: linear-gradient(90deg, var(--border-light) 25%, var(--primary-light) 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }

    .course-thumb {
      width: 72px; height: 72px; border-radius: var(--radius-md);

      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; overflow: hidden;
      box-shadow: var(--shadow-sm);

    .tag {

      background: var(--primary-light); color: var(--primary-deep);

    .course-price { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .course-price s { color: var(--text-muted); font-weight: 500; margin-right: 4px; }
    .course-price .free { color: var(--primary-deep); font-weight: 800; }

    .headline { text-align: center; margin-bottom: 14px; }
    .headline h2 { font-size: 18px; font-weight: 900; color: var(--text); line-height: 1.3; }
    .headline p { font-size: 13px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

      background: var(--primary-light);

      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;

      font-weight: 700;
      text-align: center;
      line-height: 1.5;

    /* Progress */

      margin: 14px 0 18px;
      display: flex; align-items: center; gap: 12px;

    .progress-bg {
      flex:1; height: 8px;
      background: var(--border-light);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-deep), var(--accent));
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }
    .progress-label {
      font-size: 13px; font-weight: 800;
      color: var(--primary-deep); min-width: 36px; text-align: right;
    }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .step {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      transition: all 0.3s ease;
    }
    .step.locked { opacity: 0.45; pointer-events: none; filter: grayscale(0.3); }
    .step.done { border-color: var(--primary); background: var(--success-bg); }

    .step-num {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary-deep);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; flex-shrink: 0;
      transition: all 0.3s ease;
      position: relative;

    .step.done .step-num { background: var(--primary); color: #fff; font-size: 18px; }

    .countdown-ring {
      position: absolute; top: 0; left: 0;
      width: 36px; height: 36px;
      transform: rotate(-90deg);
      pointer-events: none;
      opacity: 0; transition: opacity 0.2s;

    .countdown-ring.active { opacity: 1; }
    .countdown-ring circle {

      stroke-width: 3;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.95s linear;

    .step-title { font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.3; }

    .step-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; font-weight: 500; }

    .step-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; border: none;
      border-radius: var(--radius-sm); padding: 8px 16px;
      font-size: 13px; font-weight: 800;

      transition: all 0.2s ease;
      min-width: 64px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,175,240,.25);

    .step-btn:active { transform: scale(0.96); box-shadow: 0 1px 4px rgba(0,175,240,.2); }
    .step-btn:disabled { background: #a8cfe0; cursor: not-allowed; box-shadow: none; }
    .step-btn.watching { background: var(--primary-dark); pointer-events: none; }
    .step-btn.done-mark {
      background: transparent; color: var(--primary-deep);
      font-size: 22px; pointer-events: none; padding: 0 14px;
      box-shadow: none;
    }

    /* CTA */
    .cta-btn {
      width: 100%; padding: 16px; border-radius: var(--radius-lg); border: none;
      font-size: 16px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;

    .encyclo-icon {

    /* Confetti */
    #confetti-canvas {

      pointer-events: none;

    /* Responsive */
    @media (max-width: 380px) {
      .card { padding: 16px 12px; }

    @media (min-width: 481px) {
      .top-bar { border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
    }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════
//  TADS Context
// ═══════════════════════════════════════════════════════════
const TadsContext = createContext(null);

function TadsProvider({ children }) {
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const check = () => {
      if (window.tads && typeof window.tads.init === 'function') {
        setReady(true); return true;
      }
      return false;
    };
    if (!check()) {
      const iv = setInterval(() => { if (check()) clearInterval(iv); }, 100);
      return () => clearInterval(iv);
    }
  }, []);

  const showFullscreen = useCallback((widgetId) => {
    return new Promise((resolve) => {
      if (!window.tads || typeof window.tads.init !== 'function') {
        resolve({ status: 'error', reason: 'tads_not_ready' }); return;
      }
      let settled = false;
      const ctrl = window.tads.init({
        widgetId: widgetId,
        type: 'fullscreen',
        debug: false,
        onShowReward: () => { if (!settled) { settled = true; resolve({ status: 'reward', controller: ctrl }); } },
        onAdsNotFound: () => { if (!settled) { settled = true; resolve({ status: 'notfound', controller: ctrl }); } }
      });
      if (ctrl && typeof ctrl.showAd === 'function') {
        ctrl.showAd().catch(() => { if (!settled) { settled = true; resolve({ status: 'error', controller: ctrl }); } });
      } else {
        if (!settled) { settled = true; resolve({ status: 'error', controller: ctrl }); }
      }
      setTimeout(() => { if (!settled) { settled = true; resolve({ status: 'timeout', controller: ctrl }); } }, 7000);
    });
  }, []);

  const destroyWidget = useCallback((controller) => {
    if (controller && typeof controller.destroy === 'function') {
      try { controller.destroy(); } catch(e) {}
    }
  }, []);

  const initBanner = useCallback((widgetId, containerId) => {
    return new Promise((resolve) => {
      if (!window.tads || typeof window.tads.init !== 'function') { resolve(null); return; }
      const container = document.getElementById(containerId);
      if (!container) { resolve(null); return; }
      const ctrl = window.tads.init({ widgetId: widgetId, type: 'static', debug: false, container: container });
      if (ctrl && typeof ctrl.loadAd === 'function') {
        ctrl.loadAd().then(() => { if (ctrl.showAd) ctrl.showAd(); }).catch(() => {}).finally(() => resolve(ctrl));
      } else { resolve(ctrl); }
    });
  }, []);

  return (
    <TadsContext.Provider value={{ ready, showFullscreen, destroyWidget, initBanner }}>
      {children}
    </TadsContext.Provider>
  );
}

function useTads() { return useContext(TadsContext); }

// ═══════════════════════════════════════════════════════════
//  Confetti
// ═══════════════════════════════════════════════════════════
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#00aff0','#ffffff','#00c6ff','#005f8e','#008ecf','#e0f5fd'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 3,
    d: Math.random() * 2 + 1,
    color: colors[Math.floor(Math.random()*colors.length)],
    tilt: Math.random()*10-5,
    tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.beginPath(); ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2);
      ctx.fill();
      p.y += p.d + frame/80; p.tilt += p.tiltSpeed; p.x += Math.sin(frame/20) * 0.5;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

// ═══════════════════════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════════════════════
function b64urlDecode(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function getStartParam() {
  const tg = window.Telegram?.WebApp;
  return tg?.initDataUnsafe?.start_param
      || new URLSearchParams(window.location.search).get('startapp')
      || new URLSearchParams(window.location.search).get('tgWebAppStartParam')
      || null;
}
function resolveCourseUrl() {
  const raw = getStartParam();
  if (!raw) return 'https://www.udemy.com/';
  try {
    const text = b64urlDecode(raw);
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object' && parsed.u) return parsed.u;
  } catch (e) {}
  try { const decoded = b64urlDecode(raw); if (decoded.startsWith('http')) return decoded; } catch (e) {}
  return 'https://www.udemy.com/';
}
function parseCourseData() {
  const raw = getStartParam();
  if (!raw) return null;
  try { const text = b64urlDecode(raw); const parsed = JSON.parse(text); if (parsed && typeof parsed === 'object' && parsed.u) return parsed; } catch (e) {}
  return null;
}

// ═══════════════════════════════════════════════════════════
//  Components
// ═══════════════════════════════════════════════════════════
function Skeleton() {
  return (
    <div className="skeleton-wrap">
      <div className="skel-row">
        <div className="skel-thumb"></div>
        <div className="skel-lines">
          <div className="skel-line" style={{width:'85%'}}></div>
          <div className="skel-line" style={{width:'60%'}}></div>
          <div className="skel-line" style={{width:'45%'}}></div>
        </div>
      </div>
      <div className="skel-title"></div>
      <div className="skel-text"></div>
      <div className="skel-block"></div>
      <div className="skel-block"></div>
      <div className="skel-block" style={{height:48}}></div>
    </div>
  );
}

function Step({ num, title, sub, done, locked, playing, remaining, onClick, btnText }) {
  const circumference = 2 * Math.PI * 13;
  const progress = done ? 1 : (5 - remaining) / 5;
  const offset = circumference * (1 - progress);
  return (
    <div className={`step ${locked ? 'locked' : ''} ${done ? 'done' : ''}`}>
      <div className="step-num">
        {done ? '✓' : num}
        {!done && (
          <svg className={`countdown-ring ${playing ? 'active' : ''}`} viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="13" style={{ strokeDasharray: circumference, strokeDashoffset: offset }} />
          </svg>
        )}
      </div>
      <div className="step-body">
        <div className="step-title">{title}</div>
        <div className="step-sub">{sub}</div>
      </div>
      <button className={`step-btn ${done ? 'done-mark' : ''} ${playing ? 'watching' : ''}`}
        onClick={onClick} disabled={locked || playing || done}>
        {done ? '✓' : (playing ? (remaining > 0 ? remaining : '⏳') : btnText)}
      </button>
    </div>
  );
}

function App() {
  const { ready, showFullscreen, destroyWidget, initBanner } = useTads();
  const [loading, setLoading] = useState(true);
  const [cardVisible, setCardVisible] = useState(false);
  const [step1Done, setStep1Done] = useState(false);
  const [step2Done, setStep2Done] = useState(false);
  const [step1Playing, setStep1Playing] = useState(false);
  const [step2Playing, setStep2Playing] = useState(false);
  const [step1Rem, setStep1Rem] = useState(5);
  const [step2Rem, setStep2Rem] = useState(5);
  const [enrollUnlocked, setEnrollUnlocked] = useState(false);
  const [successVisible, setSuccessVisible] = useState(false);
  const [courseMeta, setCourseMeta] = useState({ title: 'Udemy Free Course', img: null, cat: 'Udemy', price: '', left: '' });

  const autoInstanceRef = useRef(null);
  const step1InstanceRef = useRef(null);
  const step2InstanceRef = useRef(null);
  const bannerInstanceRef = useRef(null);
  const countdown1Ref = useRef(null);
  const countdown2Ref = useRef(null);

  const COURSE_URL = useRef(resolveCourseUrl());
  const courseData = useRef(parseCourseData());

  // Load course meta
  useEffect(() => {
    let title, img, cat, price, left;
    if (courseData.current) {
      ({ t: title, i: img, c: cat, p: price, l: left } = courseData.current);
    } else {
      const p = new URLSearchParams(window.location.search);
      const get = k => p.get(k) ? decodeURIComponent(p.get(k)) : null;
      title = get('title'); img = get('img'); cat = get('cat'); price = get('price'); left = get('left');
    }
    setCourseMeta(prev => ({ ...prev, title: title || prev.title, img: img || prev.img, cat: cat || prev.cat, price: price || prev.price, left: left || prev.left }));
  }, []);

  // Telegram WebApp
  useEffect(() => {
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); if (tg.disableClosingConfirmation) tg.disableClosingConfirmation(); }
  }, []);

  // Show card
  useEffect(() => {
    const t = setTimeout(() => { setLoading(false); setCardVisible(true); }, 1200);
    return () => clearTimeout(t);
  }, []);

  // Auto fullscreen on load (#10306)
  useEffect(() => {
    if (!ready || !cardVisible) return;
    let settled = false;
    showFullscreen(10306).then((res) => {
      if (!settled) {
        settled = true;
        autoInstanceRef.current = res.controller;
        setTimeout(() => { if (autoInstanceRef.current) { destroyWidget(autoInstanceRef.current); autoInstanceRef.current = null; } }, 500);
      }
    });
    return () => { if (autoInstanceRef.current) { destroyWidget(autoInstanceRef.current); autoInstanceRef.current = null; } };
  }, [ready, cardVisible, showFullscreen, destroyWidget]);

  // TGB Banner (#9639)
  useEffect(() => {
    if (!ready || !cardVisible) return;
    initBanner(9639, 'tads-container-9639').then((ctrl) => { bannerInstanceRef.current = ctrl; });
    return () => { if (bannerInstanceRef.current) { destroyWidget(bannerInstanceRef.current); bannerInstanceRef.current = null; } };
  }, [ready, cardVisible, initBanner, destroyWidget]);

  // Step 1 (#9966)
  const handleStep1 = useCallback(() => {
    if (step1Done || step1Playing || step2Playing) return;
    setStep1Playing(true); setStep1Rem(5);
    let timerDone = false; let adHandled = false;
    function tryComplete() {
      if (timerDone && adHandled) {
        clearInterval(countdown1Ref.current);
        setStep1Playing(false); setStep1Done(true);
        if (step1InstanceRef.current) { destroyWidget(step1InstanceRef.current); step1InstanceRef.current = null; }
      }
    }
    countdown1Ref.current = setInterval(() => {
      setStep1Rem(prev => {
        if (prev <= 1) { clearInterval(countdown1Ref.current); timerDone = true; tryComplete(); return 0; }
        return prev - 1;
      });
    }, 1000);
    showFullscreen(9966).then((res) => { step1InstanceRef.current = res.controller; adHandled = true; tryComplete(); });
  }, [step1Done, step1Playing, step2Playing, showFullscreen, destroyWidget]);

  // Step 2 (#9579)
  const handleStep2 = useCallback(() => {
    if (!step1Done || step2Done || step2Playing) return;
    setStep2Playing(true); setStep2Rem(5);
    let timerDone = false; let adHandled = false;
    function tryComplete() {
      if (timerDone && adHandled) {
        clearInterval(countdown2Ref.current);
        setStep2Playing(false); setStep2Done(true);
        if (step2InstanceRef.current) { destroyWidget(step2InstanceRef.current); step2InstanceRef.current = null; }
        setEnrollUnlocked(true); setSuccessVisible(true); launchConfetti();
      }
    }
    countdown2Ref.current = setInterval(() => {
      setStep2Rem(prev => {
        if (prev <= 1) { clearInterval(countdown2Ref.current); timerDone = true; tryComplete(); return 0; }
        return prev - 1;
      });
    }, 1000);
    showFullscreen(9579).then((res) => { step2InstanceRef.current = res.controller; adHandled = true; tryComplete(); });
  }, [step1Done, step2Done, step2Playing, showFullscreen, destroyWidget]);

  // Enroll
  const handleEnroll = useCallback(() => {
    if (!step1Done || !step2Done) return;
    const tg = window.Telegram?.WebApp;
    if (tg && typeof tg.openLink === 'function') {
      tg.openLink(COURSE_URL.current, { try_instant_view: false });
    } else {
      const a = document.createElement('a');
      a.href = COURSE_URL.current; a.target = '_blank'; a.rel = 'noopener'; a.click();
    }
  }, [step1Done, step2Done]);

  // Cleanup
  useEffect(() => {
    return () => {
      clearInterval(countdown1Ref.current); clearInterval(countdown2Ref.current);
      if (autoInstanceRef.current) destroyWidget(autoInstanceRef.current);
      if (step1InstanceRef.current) destroyWidget(step1InstanceRef.current);
      if (step2InstanceRef.current) destroyWidget(step2InstanceRef.current);
      if (bannerInstanceRef.current) destroyWidget(bannerInstanceRef.current);
    };
  }, [destroyWidget]);

  const progress = (step1Done ? 1 : 0) + (step2Done ? 1 : 0);

  return (
    <div className="app-shell">
      <div className="top-bar">
        <div className="logo-box">u</div>
        <span className="logo-text">{courseMeta.title}</span>
        <span className="badge-free">FREE</span>
      </div>

      {loading && <Skeleton />}

      {cardVisible && (
        <div className="card">
          <div className="course-info">
            <div className="course-thumb">
              {courseMeta.img ? (
                <img src={courseMeta.img} alt="course" onError={(e) => { e.target.parentElement.innerHTML = '🎓'; }} />
              ) : '🎓'}
            </div>
            <div className="course-meta">
              <div className="course-title">{courseMeta.title}</div>
              <div className="course-tags">
                <span className="tag free-tag">100% FREE</span>
                <span className="tag">{courseMeta.cat}</span>
              </div>
              <div className="course-price">
                {courseMeta.price && <s>{courseMeta.price}</s>}
                <span className="free">
                  {courseMeta.left ? `🔥 ${courseMeta.left} left` : (courseMeta.price ? '→ FREE with coupon' : '🆓 FREE with coupon')}
                </span>
              </div>
            </div>
          </div>

          <div className="headline">
            <h2>🔓 Unlock Your Free Course</h2>
            <p>Complete 2 quick steps to get your free access</p>
          </div>

          {!successVisible && (
            <div className="ad-notice">
              📋 <strong>How it works:</strong> Click <strong>Visit</strong> → watch the ad for a few seconds → the next step unlocks <strong>automatically</strong>.
            </div>
          )}

          <div className="progress-wrap">
            <div className="progress-bg">
              <div className="progress-fill" style={{width: `${progress*50}%`}}></div>
            </div>
            <span className="progress-label">{progress}/2</span>
          </div>

          <div className="steps">
            <Step
              num={1}
              title="Visit Sponsor Page #1"
              sub={step1Playing ? `${step1Rem}s • watching ad…` : (step1Done ? 'Completed ✓' : '~5 seconds • watch the ad to unlock')}
              done={step1Done}
              locked={false}
              playing={step1Playing}
              remaining={step1Rem}
              onClick={handleStep1}
              btnText="Visit"
            />
            <Step
              num={2}
              title="Visit Sponsor Page #2"
              sub={step2Playing ? `${step2Rem}s • watching ad…` : (step2Done ? 'Completed ✓' : '~5 seconds • watch the ad to unlock')}
              done={step2Done}
              locked={!step1Done}
              playing={step2Playing}
              remaining={step2Rem}
              onClick={handleStep2}
              btnText="Visit"
            />
          </div>

          <button className={`cta-btn ${enrollUnlocked ? 'unlocked' : 'locked'}`} onClick={handleEnroll} disabled={!enrollUnlocked}>
            {enrollUnlocked ? '🚀 Enroll Free Now' : '🔒 Complete both steps to enroll'}
          </button>

          <div className={`success-msg ${successVisible ? 'visible' : ''}`}>
            🎉 You're all set! Click above to enroll for free.
          </div>
        </div>
      )}

      <div className="tads-banner-section">
        <div id="tads-container-9639"></div>
      </div>

      <div className="encyclo-section">
        <a className="encyclo-banner" href="https://helloencyclo.com/?ref=HUSSEINSHEIKHO" target="_blank" rel="noopener">
          <div className="encyclo-icon">🎓</div>
          <div className="encyclo-text">
            <div className="encyclo-title">Join HelloEncyclo Grant</div>
            <div className="encyclo-sub">Free scholarship to learn Programming &amp; AI</div>
          </div>
          <span className="encyclo-arrow">Join →</span>
        </a>
      </div>
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <TadsProvider>
    <App />
  </TadsProvider>
);
</script>

</body>

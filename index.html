<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ICT4U — Free Udemy Courses</title>

  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

  <!-- ══ Redirect immediately if this launch carries a startapp payload ══
       Channel post buttons still link to t.me/UdemySybot/Udemy?startapp=...
       Telegram always opens the Mini App's registered root URL (this file)
       and forwards startapp as start_param — so we hand off to the
       single-course detail page before rendering the catalog. -->
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var qs = new URLSearchParams(window.location.search);
      var startParam =
        (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
        qs.get('startapp') ||
        qs.get('tgWebAppStartParam');
      if (startParam) {
        window.location.replace('details.html?startapp=' + encodeURIComponent(startParam));
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ══ Same "Claude-style" warm cream + kraft-orange tokens as details.html ══ */
    :root {
      --bg:             #F5F4EE;
      --card:           #FFFFFF;
      --text:           #3D3929;
      --text-muted:     #87867B;
      --border:         #E8E6DA;
      --accent:         #D97757;
      --accent-dark:    #C15F3C;
      --accent-pale:    #FBEEE7;
      --radius-card:    16px;
      --shadow-card:    0 4px 24px rgba(61,57,41,.10);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app-shell { width:100%; max-width:520px; margin:0 auto; }

    /* ── Top bar ── */
    .top-bar {
      position: sticky; top:0; z-index:10;
      background: var(--card);
      padding: 16px 18px 14px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo-u {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }
    .top-title { font-size: 15px; font-weight: 800; }
    .top-sub   { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .count-badge {
      margin-left: auto;
      background: var(--accent-pale); color: var(--accent-dark);
      font-size: 11px; font-weight: 700;
      padding: 5px 10px; border-radius: 20px;
      white-space: nowrap;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 14px 14px 28px;
    }

    .course-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 12px;
      display: flex; gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease;
    }
    .course-card:active { transform: scale(.98); }

    .course-thumb {
      width: 76px; height: 76px; border-radius: 10px;
      background: var(--accent);
      flex-shrink: 0; overflow: hidden;
      display: flex; align-items:center; justify-content:center;
      font-size: 30px;
    }
    .course-thumb img { width:100%; height:100%; object-fit:cover; }

    .course-body { flex:1; min-width:0; display:flex; flex-direction:column; }
    .course-title {
      font-size: 13.5px; font-weight: 700; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .tag {
      font-size: 10.5px; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
      background: var(--accent-pale); color: var(--accent-dark);
    }
    .tag.left-tag { background: var(--accent); color:#fff; }
    .course-price { font-size: 11.5px; margin-top: auto; padding-top:6px; color: var(--text-muted); }
    .course-price s { color:#A6A499; }
    .course-price .free { color: var(--accent-dark); font-weight: 800; font-size: 12.5px; margin-left:4px; }

    /* ── Skeleton ── */
    .skel-card {
      background: var(--card); border:1px solid var(--border);
      border-radius: var(--radius-card); padding:12px;
      display:flex; gap:12px;
    }
    .skel-thumb { width:76px; height:76px; border-radius:10px; flex-shrink:0; }
    .skel-line, .skel-thumb {
      background: linear-gradient(90deg, #EDEBE0 25%, #F6F5EF 50%, #EDEBE0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    .skel-lines { flex:1; display:flex; flex-direction:column; gap:8px; justify-content:center; }
    .skel-line { height: 11px; }
    .skel-line.w60 { width:60%; }
    .skel-line.w40 { width:40%; }
    @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

    /* ── Empty / error state ── */
    .empty-state {
      text-align: center; padding: 60px 24px; color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
    .empty-state h3 { color: var(--text); font-size: 15px; margin-bottom: 6px; }
    .empty-state p  { font-size: 12.5px; line-height:1.5; }
    .retry-btn {
      margin-top: 14px; background: var(--accent); color:#fff; border:none;
      padding: 9px 18px; border-radius: 10px; font-weight:700; font-size:13px;
      cursor:pointer;
    }

    .footer-link {
      text-align:center; padding: 4px 20px 26px; font-size: 12px;
    }
    .footer-link a { color: var(--accent-dark); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <div class="logo-u">U</div>
      <div>
        <div class="top-title">ICT4U Udemy Coupons</div>
        <div class="top-sub">أحدث الكورسات المجانية</div>
      </div>
      <div class="count-badge" id="count-badge">…</div>
    </div>

    <div class="grid" id="grid">
      <!-- skeleton placeholders while loading -->
      <div class="skel-card"><div class="skel-thumb"></div>
        <div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
      <div class="skel-card"><div class="skel-thumb"></div>
        <div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
      <div class="skel-card"><div class="skel-thumb"></div>
        <div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
    </div>

    <div class="footer-link">
      📲 <a href="https://whatsapp.com/channel/0029VaC7Weq29753hpcggW2A" target="_blank" rel="noopener">Join our WhatsApp channel</a>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // ── Supabase client (publishable/anon key — read-only from here) ──
    const SUPABASE_URL = "https://wqnxyxrbtvmasuvdogrg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_63UWVbOlukOiUqsmtfQ9Jw_Go1dV3tt";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const gridEl  = document.getElementById('grid');
    const countEl = document.getElementById('count-badge');

    // ── Build the same base64url "startapp" payload the bot builds,
    //    so details.html?startapp=... decodes it with zero changes. ──
    function b64urlEncode(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function buildStartParam(course) {
      const payload = { u: course.udemy_url || course.detail_url };
      if (course.title)            payload.t = course.title.slice(0, 70);
      if (course.image_url)        payload.i = course.image_url;
      if (course.category && course.category !== 'N/A') payload.c = course.category.slice(0, 30);
      if (course.price_str)        payload.p = course.price_str.replace(/<[^>]+>/g, '');
      if (course.enrollments_left && !['N/A', '0', ''].includes(course.enrollments_left)) {
        payload.l = course.enrollments_left;
      }
      let encoded = b64urlEncode(JSON.stringify(payload));
      // Same 512-char safety trim as the bot, in the same drop order.
      const tryEncode = (p) => b64urlEncode(JSON.stringify(p));
      if (encoded.length > 512) { delete payload.i; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.c; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.p; encoded = tryEncode(payload); }
      if (encoded.length > 512 && payload.t) { payload.t = payload.t.slice(0, 30); encoded = tryEncode(payload); }
      if (encoded.length > 512) { encoded = tryEncode({ u: payload.u }); }
      return encoded;
    }

    function openCourse(course) {
      const startapp = buildStartParam(course);
      window.location.href = 'details.html?startapp=' + startapp;
    }

    function renderEmpty(message, sub) {
      gridEl.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🎓</div>
          <h3>${message}</h3>
          <p>${sub}</p>
          <button class="retry-btn" onclick="loadCourses()">Retry</button>
        </div>`;
    }

    function courseCardHTML(c) {
      const img = c.image_url
        ? `<img src="${c.image_url}" alt="" onerror="this.parentElement.innerHTML='🎓'" />`
        : '🎓';
      const catTag = (c.category && c.category !== 'N/A')
        ? `<span class="tag">${c.category}</span>` : '';
      const leftTag = (c.enrollments_left && !['N/A','0',''].includes(c.enrollments_left))
        ? `<span class="tag left-tag">🔥 ${c.enrollments_left} left</span>` : '';
      const priceHTML = c.price_str
        ? `${c.price_str} <span class="free">FREE</span>`
        : `<span class="free">🆓 FREE</span>`;
      return `
        <div class="course-card" data-id="${c.id}">
          <div class="course-thumb">${img}</div>
          <div class="course-body">
            <div class="course-title">${c.title}</div>
            <div class="course-tags">${catTag}${leftTag}</div>
            <div class="course-price">${priceHTML}</div>
          </div>
        </div>`;
    }

    async function loadCourses() {
      countEl.textContent = '…';
      try {
        const { data, error, count } = await sb
          .from('courses')
          .select('*', { count: 'exact' })
          .eq('is_active', true)
          .order('created_at', { ascending: false })
          .limit(60);

        if (error) throw error;

        if (!data || data.length === 0) {
          countEl.textContent = '0';
          renderEmpty('No courses right now', 'New free courses are added throughout the day — check back soon.');
          return;
        }

        countEl.textContent = data.length + (count && count > data.length ? '+' : '');
        gridEl.innerHTML = data.map(courseCardHTML).join('');

        gridEl.querySelectorAll('.course-card').forEach(el => {
          el.addEventListener('click', () => {
            const course = data.find(c => String(c.id) === el.dataset.id);
            if (course) openCourse(course);
          });
        });
      } catch (err) {
        console.error(err);
        countEl.textContent = '!';
        renderEmpty('Could not load courses', 'Check your connection and try again.');
      }
    }

    loadCourses();
  </script>
</body>
</html>

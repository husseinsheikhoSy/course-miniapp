<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Udemy Free Courses - Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://w.tads.me/widget.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --udemy-purple: #5624d0;
            --udemy-dark: #1e1e1e;
            --udemy-gray: #6a6f73;
            --udemy-light: #f7f9fa;
            --udemy-border: #d1d7dc;
            --udemy-success: #19a463;
            --udemy-warning: #f69c08;
            --udemy-danger: #b32d0f;
            --bg-body: #f7f9fa;
            --bg-card: #ffffff;
            --text-main: #1e1e1e;
            --text-muted: #6a6f73;
            --primary: #5624d0;
            --accent: #19a463;
            --btn-bg: #f0f0f0;
            --btn-text: #1e1e1e;
            --item-bg: #f7f9fa;
            --border-color: #d1d7dc;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-lg);
            position: relative;
            animation: slideUp 0.5s ease-out;
            border: 1px solid var(--border-color);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .progress-badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .course-preview {
            background: var(--item-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .course-preview.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .course-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .course-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .course-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .course-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .course-price {
            font-size: 14px;
            font-weight: 700;
        }

        .course-price .original {
            text-decoration: line-through;
            color: var(--text-muted);
            margin-right: 8px;
        }

        .course-price .free {
            color: var(--accent);
            font-size: 16px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            transition: all 0.3s ease;
        }

        .task-item.disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .task-item.completed {
            border-color: var(--accent);
            background: rgba(25, 164, 99, 0.06);
        }

        .task-item.active-waiting {
            border-color: var(--udemy-warning);
            background: rgba(246, 156, 8, 0.06);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: var(--udemy-warning); }
            50% { border-color: var(--border-color); }
        }

        .task-info-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .task-item.completed .task-icon {
            background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%);
            color: white;
        }

        .task-item.active-waiting .task-icon {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: var(--udemy-warning);
        }

        .task-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .task-reward {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
        }

        .task-btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.15);
        }

        .task-btn:not(:disabled):active {
            transform: translateY(0);
        }

        .task-btn.done {
            background: transparent;
            color: var(--accent);
            font-size: 22px;
            pointer-events: none;
            padding: 4px;
        }

        .task-btn.waiting {
            background: var(--udemy-warning);
            color: var(--text-main);
            cursor: wait;
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .main-btn.disabled {
            background: var(--btn-bg);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .main-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(25, 164, 99, 0.35);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(25, 164, 99, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(25, 164, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 164, 99, 0); }
        }

        .main-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(25, 164, 99, 0.45);
        }

        .tgb-ad-wrapper {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .tgb-ad-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            font-weight: 600;
        }

        #tads-container-9637 {
            width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        #tads-container-9637:empty {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .timer-display {
            font-size: 12px;
            font-weight: 700;
            color: var(--udemy-warning);
            background: rgba(246, 156, 8, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 4px;
            display: none;
        }

        .timer-display.active {
            display: inline-block;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                border-radius: var(--radius-lg);
            }

            h1 {
                font-size: 18px;
            }

            .task-title {
                font-size: 13px;
            }

            .task-btn {
                padding: 8px 14px;
                font-size: 12px;
                min-width: 70px;
            }

            .main-btn {
                padding: 14px;
                font-size: 14px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 16px;
            }

            .task-icon {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .task-info-wrapper {
                gap: 8px;
            }
        }

        /* Dark mode support for Telegram */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f0f0f;
                --bg-card: #1a1a1a;
                --text-main: #f0f0f0;
                --text-muted: #888;
                --item-bg: #242424;
                --border-color: #333;
                --btn-bg: #2a2a2a;
                --btn-text: #e0e0e0;
            }

            .task-item {
                background: var(--item-bg);
            }

            .course-preview {
                background: var(--item-bg);
            }
        }
    </style>
<base target="_blank">
</head>

<body>
    <div class="container">
        <div class="header-top">
            <div class="brand">
                <div class="brand-icon">U</div>
                <h1>Free Course Access</h1>
            </div>
            <span class="progress-badge" id="progress-text">0/2</span>
        </div>
        <p class="subtitle">Complete the tasks below to unlock your free Udemy course enrollment link.</p>

        <!-- Course Preview -->
        <div class="course-preview" id="course-preview">
            <img class="course-image" id="course-image" src="" alt="Course" style="display:none;">
            <div class="course-title" id="course-title">Loading course...</div>
            <div class="course-meta" id="course-meta">
                <span>👥 <span id="course-students">--</span></span>
                <span>⭐ <span id="course-rating">--</span></span>
                <span>🌍 <span id="course-lang">--</span></span>
            </div>
            <div class="course-price">
                <span class="original" id="course-original">$99.99</span>
                <span class="free">FREE</span>
            </div>
        </div>

        <div class="task-list">
            <!-- Task 1: First Ad (Tads Fullscreen) -->
            <div class="task-item" id="task1">
                <div class="task-info-wrapper">
                    <div class="task-icon" id="icon1">1</div>
                    <div>
                        <div class="task-title">Watch First Ad</div>
                        <div class="task-reward">⭐ Required step</div>
                        <div class="timer-display" id="timer1"></div>
                    </div>
                </div>
                <button class="task-btn" id="btn-ad1" onclick="watchAd(1)">Start</button>
            </div>

            <!-- Task 2: Second Ad (Tads Fullscreen with delay) -->
            <div class="task-item disabled" id="task2">
                <div class="task-info-wrapper">
                    <div class="task-icon" id="icon2">2</div>
                    <div>
                        <div class="task-title">Watch Second Ad</div>
                        <div class="task-reward">⭐ Required step</div>
                        <div class="timer-display" id="timer2"></div>
                    </div>
                </div>
                <button class="task-btn" id="btn-ad2" onclick="watchAd(2)" disabled>Start</button>
            </div>
        </div>

        <button class="main-btn disabled" id="btn-final" onclick="goToCourse()" disabled>
            🔒 Complete tasks to unlock
        </button>

        <!-- TGB Banner Ad -->
        <div class="tgb-ad-wrapper">
            <span class="tgb-ad-label">Sponsored</span>
            <div id="tads-container-9637"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || null;
        if (tg) { 
            tg.ready(); 
            tg.expand();
            tg.setHeaderColor('#5624d0');
            tg.setBackgroundColor('#f7f9fa');
        }

        // Tads Configuration
        const FULLSCREEN_WIDGET_ID = "9579";
        const TGB_WIDGET_ID = "9637";
        const AD_TYPE_FULLSCREEN = "fullscreen";
        const AD_TYPE_TGB = "static";
        const AD_DURATION_SECONDS = 10; // Tads.me ad duration
        const DELAY_BETWEEN_ADS = 12; // 12 seconds to ensure 2 ads are shown

        let fullscreenAdController = null;
        let tgbAdController = null;
        let currentStep = 1;
        let isAdPlaying = false;
        let adTimerInterval = null;
        let courseData = null;

        // Get course URL from start_param or default
        function getCourseUrl() {
            const code = tg?.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('startapp');
            if (!code) return 'https://www.udemy.com/';
            try {
                const decoded = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
                return decoded.startsWith('http') ? decoded : 'https://www.udemy.com/';
            } catch (e) { 
                return 'https://www.udemy.com/'; 
            }
        }

        const COURSE_URL = getCourseUrl();

        // Initialize on load
        window.addEventListener('load', () => {
            initTadsFullscreen();
            initTGBAd();
            loadCourseData();
        });

        // Load course data from URL parameters or API
        function loadCourseData() {
            // Extract course info from URL parameters if available
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title') || 'Premium Udemy Course';
            const image = params.get('image') || '';
            const students = params.get('students') || '10,000+';
            const rating = params.get('rating') || '4.5';
            const lang = params.get('lang') || 'English';
            const originalPrice = params.get('price') || '$99.99';

            courseData = {
                title, image, students, rating, lang, originalPrice
            };

            updateCoursePreview();
        }

        function updateCoursePreview() {
            if (!courseData) return;

            const preview = document.getElementById('course-preview');
            preview.classList.add('active');

            document.getElementById('course-title').textContent = courseData.title;
            document.getElementById('course-students').textContent = courseData.students;
            document.getElementById('course-rating').textContent = courseData.rating;
            document.getElementById('course-lang').textContent = courseData.lang;
            document.getElementById('course-original').textContent = courseData.originalPrice;

            if (courseData.image) {
                const img = document.getElementById('course-image');
                img.src = courseData.image;
                img.style.display = 'block';
                img.onerror = () => { img.style.display = 'none'; };
            }
        }

        // Initialize Tads Fullscreen (for both tasks)
        function initTadsFullscreen() {
            let checkTads = setInterval(() => {
                if (window.tads && typeof window.tads.init === 'function') {
                    clearInterval(checkTads);
                    fullscreenAdController = window.tads.init({
                        widgetId: FULLSCREEN_WIDGET_ID,
                        type: AD_TYPE_FULLSCREEN,
                        debug: false,
                        onShowReward: () => handleAdSuccess(),
                        onAdsNotFound: () => handleAdFallback(),
                        onError: (err) => {
                            console.error("Tads Fullscreen Error:", err);
                            resetButtonState();
                        }
                    });
                }
            }, 100);

            // Timeout after 10 seconds
            setTimeout(() => clearInterval(checkTads), 10000);
        }

        // Initialize TGB Banner Ad (bottom)
        function initTGBAd() {
            const adsNotFoundCallback = () => {
                console.log('TGB: No ads found to show');
                const container = document.getElementById(`tads-container-${TGB_WIDGET_ID}`);
                if (container) container.style.display = 'none';
            };

            function initTGBController() {
                if (!window.tads || typeof window.tads.init !== 'function') return;

                tgbAdController = window.tads.init({
                    widgetId: TGB_WIDGET_ID,
                    type: AD_TYPE_TGB,
                    debug: false,
                    onAdsNotFound: adsNotFoundCallback
                });

                if (tgbAdController && typeof tgbAdController.loadAd === 'function') {
                    tgbAdController.loadAd()
                        .then(() => tgbAdController.showAd())
                        .catch((err) => {
                            console.log("TGB Ad load error:", err);
                            adsNotFoundCallback();
                        });
                }
            }

            if (window.tads && window.tads.init) {
                initTGBController();
            } else {
                let tadsInterval = setInterval(() => {
                    if (window.tads && window.tads.init) {
                        clearInterval(tadsInterval);
                        initTGBController();
                    }
                }, 100);

                setTimeout(() => clearInterval(tadsInterval), 10000);
            }
        }

        // Main function to watch ad
        function watchAd(stepNumber) {
            if (stepNumber !== currentStep || isAdPlaying) return;
            isAdPlaying = true;

            const btn = document.getElementById(`btn-ad${stepNumber}`);
            const item = document.getElementById(`task${stepNumber}`);
            const timer = document.getElementById(`timer${stepNumber}`);

            btn.innerHTML = '<span class="loading-spinner"></span>';
            btn.disabled = true;
            item.classList.add('active-waiting');

            if (stepNumber === 1) {
                // Task 1: Show ad immediately
                showFullscreenAd(stepNumber);
            } else if (stepNumber === 2) {
                // Task 2: Show ad with delay to ensure 2 ads are watched
                startDelayedAd(stepNumber);
            }
        }

        // Show fullscreen ad immediately
        function showFullscreenAd(stepNumber) {
            if (fullscreenAdController) {
                fullscreenAdController.showAd()
                    .then(() => {
                        // Ad is showing, start countdown
                        startAdCountdown(stepNumber, AD_DURATION_SECONDS);
                    })
                    .catch((err) => {
                        console.error("Failed to display fullscreen ad:", err);
                        handleAdFallback();
                    });
            } else {
                console.warn("Fullscreen controller not ready, using fallback");
                handleAdFallback();
            }
        }

        // Start delayed ad with countdown for Task 2
        function startDelayedAd(stepNumber) {
            const btn = document.getElementById(`btn-ad${stepNumber}`);
            const timer = document.getElementById(`timer${stepNumber}`);
            let remaining = DELAY_BETWEEN_ADS;

            timer.classList.add('active');
            timer.textContent = `Wait ${remaining}s...`;
            btn.innerText = "Waiting...";

            const countdownInterval = setInterval(() => {
                remaining--;
                timer.textContent = `Wait ${remaining}s...`;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timer.classList.remove('active');
                    // Now show the actual ad
                    showFullscreenAd(stepNumber);
                }
            }, 1000);
        }

        // Countdown during ad playback
        function startAdCountdown(stepNumber, seconds) {
            const timer = document.getElementById(`timer${stepNumber}`);
            let remaining = seconds;

            timer.classList.add('active');
            timer.textContent = `Ad ${remaining}s...`;

            adTimerInterval = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    timer.textContent = `Ad ${remaining}s...`;
                } else {
                    timer.classList.remove('active');
                    clearInterval(adTimerInterval);
                }
            }, 1000);
        }

        // Handle ad success (shared)
        function handleAdSuccess() {
            if (!isAdPlaying) return;
            isAdPlaying = false;

            // Clear any running timers
            if (adTimerInterval) {
                clearInterval(adTimerInterval);
                adTimerInterval = null;
            }

            const currentBtn = document.getElementById(`btn-ad${currentStep}`);
            const currentItem = document.getElementById(`task${currentStep}`);
            const currentIcon = document.getElementById(`icon${currentStep}`);
            const currentTimer = document.getElementById(`timer${currentStep}`);

            currentBtn.innerText = "✅";
            currentBtn.classList.add('done');
            currentItem.classList.remove('active-waiting');
            currentItem.classList.add('completed');
            currentIcon.innerText = "✓";
            currentTimer.classList.remove('active');

            document.getElementById('progress-text').textContent = `${currentStep}/2`;
            currentStep++;

            if (currentStep === 2) {
                const nextBtn = document.getElementById('btn-ad2');
                const nextItem = document.getElementById('task2');
                nextItem.classList.remove('disabled');
                nextBtn.disabled = false;
            } else if (currentStep > 2) {
                const finalBtn = document.getElementById('btn-final');
                finalBtn.classList.remove('disabled');
                finalBtn.classList.add('active');
                finalBtn.disabled = false;
                finalBtn.innerHTML = "🚀 Get Free Course Now";
            }
        }

        // Fallback mechanism if ad fails
        function handleAdFallback() {
            console.warn("Using fallback due to unavailable ad or error");
            setTimeout(() => {
                handleAdSuccess();
            }, 2000);
        }

        // Reset button state on error
        function resetButtonState() {
            isAdPlaying = false;
            const btn = document.getElementById(`btn-ad${currentStep}`);
            const item = document.getElementById(`task${currentStep}`);
            const timer = document.getElementById(`timer${currentStep}`);

            if (btn) {
                btn.innerText = "Start";
                btn.disabled = false;
            }
            if (item) item.classList.remove('active-waiting');
            if (timer) timer.classList.remove('active');

            if (adTimerInterval) {
                clearInterval(adTimerInterval);
                adTimerInterval = null;
            }
        }

        // Navigate to course
        function goToCourse() {
            if (tg?.openLink) {
                tg.openLink(COURSE_URL);
                setTimeout(() => tg.close(), 1500);
            } else {
                window.open(COURSE_URL, '_blank');
            }
        }

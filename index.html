  <!-- Course deep-link routing.
       Important: Telegram can keep start_param in initData while the Mini App
       is being restored. Route only on the first active launch, and never
       use a navigation assignment from visibility/close events. -->
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var qs = new URLSearchParams(window.location.search);
      var startParam =
        qs.get('startapp') ||
        qs.get('tgWebAppStartParam') ||
        (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);

      if (!startParam) return;

      // ---------------------------------------------------------------
      // Pixel Mini App deep-link router.
      // Pixel channel buttons use the Telegram Mini App URL:
      //   t.me/UdemySybot/Udemy?startapp=px_<base64-payload>
      // Telegram opens this registered Mini App first and supplies the
      // start parameter through initDataUnsafe. Route the payload to the
      // standalone Pixel download page instead of details.html.
      // ---------------------------------------------------------------
      if (startParam.indexOf('px_') === 0) {
        var pixelPayload = startParam.slice(3);
        if (pixelPayload) {
          window.location.replace('dl.html?startapp=' + encodeURIComponent(pixelPayload));
        }
        return;
      }

      try {
        var key = 'udemy_deeplink_' + startParam;
        var now = Date.now();
        var previous = sessionStorage.getItem(key);
        var previousAt = previous ? Number(previous) : 0;

        // Telegram may restore the root Mini App after closing. Do not
        // immediately send it back to details in that same WebView session.
        if (previousAt && (now - previousAt) < 60000) return;

        sessionStorage.setItem(key, String(now));
      } catch (e) {}

      // replace() keeps the catalog out of the browser back-stack.
      window.location.replace('details.html?startapp=' + encodeURIComponent(startParam));
    })();
  </script>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      // Do not force viewport expansion repeatedly; Telegram owns the Mini App
      // window and its native close button.
      try {
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#09090b');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#09090b');
        if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor('#09090b');
        if (typeof tg.disableClosingConfirmation === 'function') tg.disableClosingConfirmation();
      } catch (e) {}
    }

    // ── Supabase client (publishable/anon key — read-only from here) ──
    const SUPABASE_URL = "https://wqnxyxrbtvmasuvdogrg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_63UWVbOlukOiUqsmtfQ9Jw_Go1dV3tt";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const gridEl  = document.getElementById('grid');
    const countEl = document.getElementById('count-badge');

    // ══════════════════════════════════════════════════════════════
    //  One-time welcome Interstitial ad — Udemy interstitial unit
    //  (int-46421). Shown at most ONCE per session: a sessionStorage
    //  flag is set the instant we attempt to show it, so even rapid
    //  re-entry into the page (or a slow/failed ad) can't trigger it
    //  twice. Purely a monetization touch — never blocks browsing or
    //  any core action, and failures are silently ignored.
    // ══════════════════════════════════════════════════════════════
    const ADSGRAM_INTERSTITIAL_ID = 'int-46421';
    const INTERSTITIAL_SESSION_KEY = 'udemy_interstitial_shown';
    let interstitialCtrl = null;

    function getInterstitial() {
      if (interstitialCtrl) return interstitialCtrl;
      if (window.Adsgram && typeof window.Adsgram.init === 'function') {
        interstitialCtrl = window.Adsgram.init({ blockId: ADSGRAM_INTERSTITIAL_ID });
      }
      return interstitialCtrl;
    }

    function showWelcomeInterstitialOnce() {
      try {
        if (sessionStorage.getItem(INTERSTITIAL_SESSION_KEY) === '1') return;
        sessionStorage.setItem(INTERSTITIAL_SESSION_KEY, '1'); // mark first, so it can never fire twice
      } catch (e) { /* sessionStorage unavailable — skip rather than risk repeats */ return; }

      const ctrl = getInterstitial();
      if (!ctrl) return;
      ctrl.show().catch(() => { /* closed early or no fill — nothing to do */ });
    }

    // ── Debug logging — always to console; also on-screen if the page
    //    is opened with ?debug=1 appended to the URL. Use this to see,
    //    on a real device, whether Telegram is even handing us a user
    //    object (tg.initDataUnsafe.user) and whether the RPC call itself
    //    is succeeding or being rejected. ─────────────────────────────
    const DEBUG = new URLSearchParams(window.location.search).get('debug') === '1';
    function debugLog(...args) {
      console.log('[MiniApp]', ...args);
      if (!DEBUG) return;
      let box = document.getElementById('__debug_box');
      if (!box) {
        box = document.createElement('div');
        box.id = '__debug_box';
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40vh;' +
          'overflow:auto;background:rgba(0,0,0,.88);color:#7CFC7C;font:11px monospace;' +
          'padding:8px;z-index:99999;white-space:pre-wrap;';
        document.body.appendChild(box);
      }
      const line = document.createElement('div');
      line.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
      box.appendChild(line);
    }

    // ── Register/refresh this visitor in bot_users ──────────────────
    // Calls register_mini_app_visitor() — the same RPC details.html uses —
    // keyed on the visitor's real Telegram chat_id (tg.initDataUnsafe.user.id).
    // chat_id is the table's primary key and the RPC does an upsert on it,
    // so opening index.html, details.html, and/or /start in the bot — any
    // order, any number of times — still produces exactly one bot_users
    // row, never a duplicate. Skipped entirely if the page isn't opened
    // inside Telegram with valid initData (no tg user object available),
    // so random web visitors are never logged.
    async function registerVisitor() {
      const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      debugLog('initDataUnsafe.user =', tgUser || null);

      if (!tgUser || !tgUser.id) {
        debugLog('registerVisitor: SKIPPED — no Telegram user in initData. ' +
          'This means the page was not opened as a real Telegram Mini App ' +
          '(check the Mini App URL / menu button setup in @BotFather).');
        return;
      }

      let countryCode = null, countryName = null;
      try {
        const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
        if (geo && !geo.error) {
          countryCode = geo.country_code || null;
          countryName = geo.country_name || null;
        }
      } catch (e) { /* geolocation lookup is best-effort only */ }

      const { error } = await sb.rpc('register_mini_app_visitor', {
        p_chat_id: tgUser.id,
        p_username: tgUser.username || null,
        p_first_name: tgUser.first_name || null,
        p_country_code: countryCode,
        p_country_name: countryName
      });

      // Previously this result was never checked, so RPC failures (RLS,
      // missing function, bad params, etc.) were silently swallowed —
      // nothing was saved AND no error appeared anywhere. Fixed now.
      if (error) {
        console.error('registerVisitor: RPC failed:', error);
        debugLog('registerVisitor: RPC FAILED —', error.message || error);
      } else {
        debugLog('registerVisitor: OK — chat_id', tgUser.id, 'registered/updated.');
      }
    }
    registerVisitor();

    // ── Build the same base64url "startapp" payload the bot builds,
    //    so details.html?startapp=... decodes it with zero changes. ──
    function b64urlEncode(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function buildStartParam(course) {
      const payload = { u: course.udemy_url || course.detail_url };
      if (course.title)            payload.t = course.title.slice(0, 70);
      if (course.image_url)        payload.i = course.image_url;
      if (course.category && course.category !== 'N/A') payload.c = course.category.slice(0, 30);
      if (course.price_str)        payload.p = course.price_str.replace(/<[^>]+>/g, '');
      if (course.enrollments_left && !['N/A', '0', ''].includes(course.enrollments_left)) {
        payload.l = course.enrollments_left;
      }
      let encoded = b64urlEncode(JSON.stringify(payload));
      // Same 512-char safety trim as the bot, in the same drop order.
      const tryEncode = (p) => b64urlEncode(JSON.stringify(p));
      if (encoded.length > 512) { delete payload.i; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.c; encoded = tryEncode(payload); }
      if (encoded.length > 512) { delete payload.p; encoded = tryEncode(payload); }
      if (encoded.length > 512 && payload.t) { payload.t = payload.t.slice(0, 30); encoded = tryEncode(payload); }
      if (encoded.length > 512) { encoded = tryEncode({ u: payload.u }); }
      return encoded;
    }

    function openCourse(course) {
      const startapp = buildStartParam(course);
      window.location.href = 'details.html?startapp=' + startapp;
    }

    function renderEmpty(message, sub) {
      gridEl.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🎓</div>
          <h3>${message}</h3>
          <p>${sub}</p>
          <button class="retry-btn" onclick="loadCourses()">Retry</button>
        </div>`;
    }

    function courseCardHTML(c) {
      const img = c.image_url
        ? `<img src="${c.image_url}" alt="" onerror="this.parentElement.innerHTML='🎓'" />`
        : '🎓';
      const catTag = (c.category && c.category !== 'N/A')
        ? `<span class="tag">${c.category}</span>` : '';
      const leftTag = (c.enrollments_left && !['N/A','0',''].includes(c.enrollments_left))
        ? `<span class="tag left-tag">🔥 ${c.enrollments_left} left</span>` : '';
      const priceHTML = c.price_str
        ? `${c.price_str} <span class="free">FREE</span>`
        : `<span class="free">🆓 FREE</span>`;
      return `
        <div class="course-card" data-id="${encodeURIComponent(c.detail_url)}">
          <div class="course-thumb">${img}</div>
          <div class="course-body">
            <div class="course-title">${c.title}</div>
            <div class="course-tags">${catTag}${leftTag}</div>
            <div class="course-price">${priceHTML}</div>
          </div>
        </div>`;
    }

    async function loadCourses() {
      countEl.textContent = '…';
      try {
        // Merged from two independent source tables — the catalog is
        // presented as a single unified feed, the user never sees which
        // site a course originally came from.
        const [r1, r2] = await Promise.all([
          sb.from('courses').select('*', { count: 'exact' })
            .eq('is_active', true).order('created_at', { ascending: false }).limit(60),
          sb.from('courses_udemyxpert').select('*', { count: 'exact' })
            .eq('is_active', true).order('created_at', { ascending: false }).limit(60),
        ]);

        if (r1.error) throw r1.error;
        if (r2.error) throw r2.error;

        const data = [...(r1.data || []), ...(r2.data || [])]
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, 60);
        const count = (r1.count || 0) + (r2.count || 0);

        if (!data || data.length === 0) {
          countEl.textContent = '0';
          renderEmpty('No courses right now', 'New free courses are added throughout the day — check back soon.');
          return;
        }

        countEl.textContent = data.length + (count && count > data.length ? '+' : '');

        // Native Task ad — a single sponsored card mixed naturally into
        // the grid (after the 4th course). Pure browsing content, so it
        // never touches any core action — fully compliant with Adsgram's
        // "no ad required for basic functions" rule.
        const taskCardHTML =
          `<adsgram-task data-block-id="task-40716" data-debug="false" class="task"></adsgram-task>`;
        const cards = data.map(courseCardHTML);
        if (cards.length > 4) cards.splice(4, 0, taskCardHTML);
        else cards.push(taskCardHTML);
        gridEl.innerHTML = cards.join('');

        gridEl.querySelectorAll('.course-card').forEach(el => {
          el.addEventListener('click', () => {
            const course = data.find(c => encodeURIComponent(c.detail_url) === el.dataset.id);
            if (course) openCourse(course);
          });
        });
      } catch (err) {
        console.error(err);
        countEl.textContent = '!';
        renderEmpty('Could not load courses', 'Check your connection and try again.');
      }
    }

    loadCourses().then(() => {
      // Small delay so the catalog is visibly rendered first —
      // avoids the ad covering a blank/loading screen.
      setTimeout(showWelcomeInterstitialOnce, 800);
    });
  </script>

<script id="telegram-mini-app-home-optimization-js">
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;

  try {
    tg.ready();

    const root = document.documentElement;
    function setVar(name, value) {
      if (value === undefined || value === null) return;
      root.style.setProperty(name, Math.max(0, Number(value) || 0) + "px");
    }
    function syncViewport() {
      const s = tg.safeAreaInset || {};
      const c = tg.contentSafeAreaInset || {};
      setVar("--tg-safe-area-inset-top", s.top);
      setVar("--tg-safe-area-inset-bottom", s.bottom);
      setVar("--tg-safe-area-inset-left", s.left);
      setVar("--tg-safe-area-inset-right", s.right);
      setVar("--tg-content-safe-area-inset-top", c.top);
      setVar("--tg-content-safe-area-inset-bottom", c.bottom);
      setVar("--tg-content-safe-area-inset-left", c.left);
      setVar("--tg-content-safe-area-inset-right", c.right);
    }
    syncViewport();

    if (typeof tg.onEvent === "function") {
      tg.onEvent("viewportChanged", syncViewport);
      tg.onEvent("safeAreaChanged", syncViewport);
      tg.onEvent("contentSafeAreaChanged", syncViewport);
    }
    window.addEventListener("resize", syncViewport, { passive:true });
    window.addEventListener("orientationchange", () => setTimeout(syncViewport,100), { passive:true });
  } catch (e) {
    console.warn("Telegram Mini App initialization:", e);
  }
})();
</script>

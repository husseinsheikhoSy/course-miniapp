<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════
//  TADS Context & Hook (React-style wrapper around tads.me)
// ═══════════════════════════════════════════════════════════
const TadsContext = createContext(null);

function TadsProvider({ children }) {
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const check = () => {
      if (window.tads && typeof window.tads.init === 'function') {
        setReady(true);
        return true;
      }
      return false;
    };
    if (!check()) {
      const iv = setInterval(() => { if (check()) clearInterval(iv); }, 100);
      return () => clearInterval(iv);
    }
  }, []);

  const showFullscreen = useCallback((widgetId) => {
    return new Promise((resolve) => {
      if (!window.tads || typeof window.tads.init !== 'function') {
        resolve({ status: 'error', reason: 'tads_not_ready' });
        return;
      }
      let settled = false;
      const ctrl = window.tads.init({
        widgetId: widgetId,
        type: 'fullscreen',
        debug: false,
        onShowReward: () => {
          if (!settled) { settled = true; resolve({ status: 'reward', controller: ctrl }); }
        },
        onAdsNotFound: () => {
          if (!settled) { settled = true; resolve({ status: 'notfound', controller: ctrl }); }
        }
      });
      if (ctrl && typeof ctrl.showAd === 'function') {
        ctrl.showAd().catch(() => {
          if (!settled) { settled = true; resolve({ status: 'error', controller: ctrl }); }
        });
      } else {
        if (!settled) { settled = true; resolve({ status: 'error', controller: ctrl }); }
      }
      setTimeout(() => {
        if (!settled) { settled = true; resolve({ status: 'timeout', controller: ctrl }); }
      }, 7000);
    });
  }, []);

  const destroyWidget = useCallback((controller) => {
    if (controller && typeof controller.destroy === 'function') {
      try { controller.destroy(); } catch(e) {}
    }
  }, []);

  const initBanner = useCallback((widgetId, containerId) => {
    return new Promise((resolve) => {
      if (!window.tads || typeof window.tads.init !== 'function') {
        resolve(null);
        return;
      }
      const container = document.getElementById(containerId);
      if (!container) { resolve(null); return; }
      const ctrl = window.tads.init({
        widgetId: widgetId,
        type: 'static',
        debug: false,
        container: container
      });
      if (ctrl && typeof ctrl.loadAd === 'function') {
        ctrl.loadAd()
          .then(() => { if (ctrl.showAd) ctrl.showAd(); })
          .catch(() => {})
          .finally(() => resolve(ctrl));
      } else {
        resolve(ctrl);
      }
    });
  }, []);

  return (
    <TadsContext.Provider value={{ ready, showFullscreen, destroyWidget, initBanner }}>
      {children}
    </TadsContext.Provider>
  );
}

function useTads() {
  return useContext(TadsContext);
}

// ═══════════════════════════════════════════════════════════
//  Confetti
// ═══════════════════════════════════════════════════════════
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#00aff0','#ffffff','#00c6ff','#005f8e','#008ecf','#e0f5fd'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 3,
    d: Math.random() * 2 + 1,
    color: colors[Math.floor(Math.random()*colors.length)],
    tilt: Math.random()*10-5,
    tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2);
      ctx.fill();
      p.y += p.d + frame/80;
      p.tilt += p.tiltSpeed;
      p.x += Math.sin(frame/20) * 0.5;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

// ═══════════════════════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════════════════════
function b64urlDecode(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function getStartParam() {
  const tg = window.Telegram?.WebApp;
  return tg?.initDataUnsafe?.start_param
      || new URLSearchParams(window.location.search).get('startapp')
      || new URLSearchParams(window.location.search).get('tgWebAppStartParam')
      || null;
}

function resolveCourseUrl() {
  const raw = getStartParam();
  if (!raw) return 'https://www.udemy.com/';
  try {
    const text = b64urlDecode(raw);
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object' && parsed.u) return parsed.u;
  } catch (e) {}
  try {
    const decoded = b64urlDecode(raw);
    if (decoded.startsWith('http')) return decoded;
  } catch (e) {}
  return 'https://www.udemy.com/';
}

function parseCourseData() {
  const raw = getStartParam();
  if (!raw) return null;
  try {
    const text = b64urlDecode(raw);
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object' && parsed.u) return parsed;
  } catch (e) {}
  return null;
}

  );
}

function Step({ num, title, sub, done, locked, playing, remaining, onClick, btnText }) {
  const circumference = 2 * Math.PI * 13;
  const progress = done ? 1 : (5 - remaining) / 5;
  const offset = circumference * (1 - progress);

  return (
    <div className={`step ${locked ? 'locked' : ''} ${done ? 'done' : ''}`} id={`step-${num}`}>
      <div className="step-num" id={`num-${num}`}>
        {done ? '✓' : num}
        {!done && (
          <svg className={`countdown-ring ${playing ? 'active' : ''}`} id={`ring-${num}`} viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="13" id={`ring-circle-${num}`}
              style={{
                strokeDasharray: circumference,
                strokeDashoffset: offset
              }} />
          </svg>
        )}
      </div>
      <div className="step-body">
        <div className="step-title">{title}</div>
        <div className="step-sub" id={`sub-${num}`}>{sub}</div>
      </div>
      <button
        className={`step-btn ${done ? 'done-mark' : ''} ${playing ? 'watching' : ''}`}
        id={`btn-${num}`}
        onClick={onClick}
        disabled={locked || playing || done}
      >
        {done ? '✓' : (playing ? (remaining > 0 ? remaining : '⏳') : btnText)}
      </button>
    </div>
  );
}

function App() {
  const { ready, showFullscreen, destroyWidget, initBanner } = useTads();
  const [loading, setLoading] = useState(true);
  const [cardVisible, setCardVisible] = useState(false);
  const [step1Done, setStep1Done] = useState(false);
  const [step2Done, setStep2Done] = useState(false);
  const [step1Playing, setStep1Playing] = useState(false);
  const [step2Playing, setStep2Playing] = useState(false);
  const [step1Rem, setStep1Rem] = useState(5);
  const [step2Rem, setStep2Rem] = useState(5);
  const [enrollUnlocked, setEnrollUnlocked] = useState(false);
  const [successVisible, setSuccessVisible] = useState(false);
  const [courseMeta, setCourseMeta] = useState({ title: 'Udemy Free Course', img: null, cat: 'Udemy', price: '', left: '' });

  const autoInstanceRef = useRef(null);
  const step1InstanceRef = useRef(null);
  const step2InstanceRef = useRef(null);
  const bannerInstanceRef = useRef(null);
  const timer1Ref = useRef(null);
  const timer2Ref = useRef(null);
  const countdown1Ref = useRef(null);
  const countdown2Ref = useRef(null);

  const COURSE_URL = useRef(resolveCourseUrl());
  const courseData = useRef(parseCourseData());

  // ── Load course meta ──
  useEffect(() => {
    let title, img, cat, price, left;
    if (courseData.current) {
      ({ t: title, i: img, c: cat, p: price, l: left } = courseData.current);
    } else {
      const p = new URLSearchParams(window.location.search);
      const get = k => p.get(k) ? decodeURIComponent(p.get(k)) : null;
      title = get('title'); img = get('img'); cat = get('cat'); price = get('price'); left = get('left');
    }
    setCourseMeta(prev => ({
      ...prev,
      title: title || prev.title,
      img: img || prev.img,
      cat: cat || prev.cat,
      price: price || prev.price,
      left: left || prev.left
    }));
  }, []);

  // ── Telegram WebApp ──
  useEffect(() => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    }
  }, []);

  // ── Show card after short delay ──
  useEffect(() => {
    const t = setTimeout(() => { setLoading(false); setCardVisible(true); }, 1200);
    return () => clearTimeout(t);
  }, []);

  // ── Auto fullscreen on load (#10306) ──
  useEffect(() => {
    if (!ready || !cardVisible) return;
    let settled = false;
    showFullscreen(10306).then((res) => {
      if (!settled) {
        settled = true;
        autoInstanceRef.current = res.controller;
        // destroy after ad completes
        setTimeout(() => {
          if (autoInstanceRef.current) {
            destroyWidget(autoInstanceRef.current);
            autoInstanceRef.current = null;
          }
        }, 500);
      }
    });
    return () => {
      if (autoInstanceRef.current) {
        destroyWidget(autoInstanceRef.current);
        autoInstanceRef.current = null;
      }
    };
  }, [ready, cardVisible, showFullscreen, destroyWidget]);

  // ── TGB Banner (#9639) ──
  useEffect(() => {
    if (!ready || !cardVisible) return;
    initBanner(9639, 'tads-container-9639').then((ctrl) => {
      bannerInstanceRef.current = ctrl;
    });
    return () => {
      if (bannerInstanceRef.current) {
        destroyWidget(bannerInstanceRef.current);
        bannerInstanceRef.current = null;
      }
    };
  }, [ready, cardVisible, initBanner, destroyWidget]);

  // ── Step 1 handler (#9966) ──
  const handleStep1 = useCallback(() => {
    if (step1Done || step1Playing || step2Playing) return;
    setStep1Playing(true);
    setStep1Rem(5);

    let timerDone = false;
    let adHandled = false;

    function tryComplete() {
      if (timerDone && adHandled) {
        clearInterval(countdown1Ref.current);
        setStep1Playing(false);
        setStep1Done(true);
        if (step1InstanceRef.current) {
          destroyWidget(step1InstanceRef.current);
          step1InstanceRef.current = null;
        }
      }
    }

    countdown1Ref.current = setInterval(() => {
      setStep1Rem(prev => {
        if (prev <= 1) {
          clearInterval(countdown1Ref.current);
          timerDone = true;
          tryComplete();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);

    showFullscreen(9966).then((res) => {
      step1InstanceRef.current = res.controller;
      adHandled = true;
      tryComplete();
    });
  }, [step1Done, step1Playing, step2Playing, showFullscreen, destroyWidget]);

  // ── Step 2 handler (#9579) ──
  const handleStep2 = useCallback(() => {
    if (!step1Done || step2Done || step2Playing) return;
    setStep2Playing(true);
    setStep2Rem(5);

    let timerDone = false;
    let adHandled = false;

    function tryComplete() {
      if (timerDone && adHandled) {
        clearInterval(countdown2Ref.current);
        setStep2Playing(false);
        setStep2Done(true);
        if (step2InstanceRef.current) {
          destroyWidget(step2InstanceRef.current);
          step2InstanceRef.current = null;
        }
        setEnrollUnlocked(true);
        setSuccessVisible(true);
        launchConfetti();
      }
    }

    countdown2Ref.current = setInterval(() => {
      setStep2Rem(prev => {
        if (prev <= 1) {
          clearInterval(countdown2Ref.current);
          timerDone = true;
          tryComplete();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);

    showFullscreen(9579).then((res) => {
      step2InstanceRef.current = res.controller;
      adHandled = true;
      tryComplete();
    });
  }, [step1Done, step2Done, step2Playing, showFullscreen, destroyWidget]);

  // ── Enroll ──
  const handleEnroll = useCallback(() => {
    if (!step1Done || !step2Done) return;
    const tg = window.Telegram?.WebApp;
    if (tg && typeof tg.openLink === 'function') {
      tg.openLink(COURSE_URL.current, { try_instant_view: false });
    } else {
      const a = document.createElement('a');
      a.href = COURSE_URL.current;
      a.target = '_blank';
      a.rel = 'noopener';
      a.click();
    }
  }, [step1Done, step2Done]);

  // ── Cleanup on unmount ──
  useEffect(() => {
    return () => {
      clearInterval(countdown1Ref.current);
      clearInterval(countdown2Ref.current);
      clearTimeout(timer1Ref.current);
      clearTimeout(timer2Ref.current);
      if (autoInstanceRef.current) destroyWidget(autoInstanceRef.current);
      if (step1InstanceRef.current) destroyWidget(step1InstanceRef.current);
      if (step2InstanceRef.current) destroyWidget(step2InstanceRef.current);
      if (bannerInstanceRef.current) destroyWidget(bannerInstanceRef.current);
    };
  }, [destroyWidget]);

  const progress = (step1Done ? 1 : 0) + (step2Done ? 1 : 0);

  return (
    <div className="app-shell">
      <div className="top-bar">
        <div className="logo-u">u</div>
        <span className="logo-text" id="logo-text">{courseMeta.title}</span>
        <span className="badge-free">FREE</span>
      </div>

      {loading && <Skeleton />}

      <div className={`card ${cardVisible ? 'visible' : ''}`} id="main-card">
        <div className="course-info">
          <div className="course-thumb" id="course-thumb">
            {courseMeta.img ? (
              <img src={courseMeta.img} alt="course" onError={(e) => { e.target.parentElement.innerHTML = '🎓'; }} />
            ) : '🎓'}
          </div>
          <div className="course-meta">
            <div className="course-title" id="course-title">{courseMeta.title}</div>
            <div className="course-tags">
              <span className="tag free-tag">100% FREE</span>
              <span className="tag" id="course-cat">{courseMeta.cat}</span>
            </div>
            <div className="course-price">
              {courseMeta.price && <s id="course-price-original">{courseMeta.price}</s>}
              <span className="free" id="free-label">
                {courseMeta.left ? `🔥 ${courseMeta.left} left` : (courseMeta.price ? '→ FREE with coupon' : '🆓 FREE with coupon')}
              </span>
            </div>
          </div>
        </div>

        <div className="unlock-headline">
          <h2>🔓 Unlock Your Free Course</h2>
        </div>

        <div className="ad-notice" id="ad-notice" style={{display: successVisible ? 'none' : 'block'}}>
          📋 <strong>How it works:</strong> Click <strong>Visit</strong> → watch the ad for a few seconds → the next step unlocks <strong>automatically</strong>.
        </div>

        <div className="progress-wrap">
          <div className="progress-bar-bg">
            <div className="progress-bar-fill" id="progress-fill" style={{width: `${progress*50}%`}}></div>
          </div>
          <span className="progress-label" id="progress-label">{progress}/2</span>
        </div>

        <div className="steps">
          <Step
            num={1}
            title="Visit Sponsor Page #1"
            sub={step1Playing ? `${step1Rem}s • watching ad…` : (step1Done ? 'Completed ✓' : '~5 seconds • watch the ad to unlock')}
            done={step1Done}
            locked={false}
            playing={step1Playing}
            remaining={step1Rem}
            onClick={handleStep1}
            btnText="Visit"
          />
          <Step
            num={2}
            title="Visit Sponsor Page #2"
            sub={step2Playing ? `${step2Rem}s • watching ad…` : (step2Done ? 'Completed ✓' : '~5 seconds • watch the ad to unlock')}
            done={step2Done}
            locked={!step1Done}
            playing={step2Playing}
            remaining={step2Rem}
            onClick={handleStep2}
            btnText="Visit"
          />
        </div>

        <button
          className={`cta-btn ${enrollUnlocked ? 'unlocked' : 'locked'}`}
          id="btn-enroll"
          onClick={handleEnroll}
          disabled={!enrollUnlocked}
        >
          {enrollUnlocked ? '🚀 Enroll Free Now' : '🔒 Complete both steps to enroll'}
        </button>

        <div className={`success-msg ${successVisible ? 'visible' : ''}`} id="success-msg">
          🎉 You're all set! Click above to enroll for free.
        </div>
      </div>

      <div className="tads-banner-section" id="tads-banner-section">
        <div id="tads-container-9639"></div>
      </div>

      <div className="encyclo-section">
        <a className="encyclo-banner" href="https://helloencyclo.com/?ref=HUSSEINSHEIKHO" target="_blank" rel="noopener">
          <div className="encyclo-icon">🎓</div>
          <div className="encyclo-text">
            <div className="encyclo-title">Join HelloEncyclo Grant</div>
            <div className="encyclo-sub">Free scholarship to learn Programming &amp; AI</div>
          </div>
          <span className="encyclo-arrow">Join →</span>
        </a>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  Mount
// ═══════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <TadsProvider>
    <App />
  </TadsProvider>
);
</script>

</body>
</html>
